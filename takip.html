<script>

if(S&&Date.now()<(o.son||0)&&(S.ka||(S.anahtarlar&&S.anahtarlar.saha)))return;}catch(e){}
if(location.search.indexOf('yerel=1')>=0)return;
location.replace((location.hostname.slice(-9)==='github.io'?'/aesun/portal/':location.hostname.indexOf('portal.')===0?'/':'/portal/')+'?git=saha');})();

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F6;--card:#fff;--ink:#1C1F24;--mut:#6B7280;--line:#E5E7EB;--soft:#F8F9FB;
--org:#E8622A;--red:#E50E2A;--char:#2B2F35;--grn:#1F8A4C;--amb:#C97A0B;--blu:#2F6DB5;--pur:#6F4CC9;
--r:14px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--rail:232px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.45 'Barlow',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
/* header */
#hdr{position:sticky;top:0;z-index:40;background:var(--char);color:#fff;padding:10px 16px calc(10px);display:flex;align-items:center;gap:12px;padding-top:calc(10px + env(safe-area-inset-top))}
#hdr .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#E8833A,#E50E2A);display:grid;place-items:center;font-size:19px;flex:none}
#hdr .t{flex:1;min-width:0;cursor:pointer}
#hdr .t b{display:block;font:800 17px/1.1 'Barlow Semi Condensed';letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .t small{display:block;font-size:12px;color:#B8BDC6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .dot{width:9px;height:9px;border-radius:50%;background:#9CA3AF;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
#hdr .dot.ok{background:#3CCB7F}#hdr .dot.busy{background:#F5B942;animation:pul 1s infinite}#hdr .dot.err{background:#FF5C5C}#hdr .dot.off{background:#9CA3AF}
@keyframes pul{50%{opacity:.35}}
#hdr .u{font-size:12px;color:#D1D5DB;text-align:right;line-height:1.2}
#hdr .u b{display:block;color:#fff;font-weight:700}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:8px 2px 7px;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
#nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--org)}
/* layout */
#app{max-width:1180px;margin:0 auto;padding:14px 14px 20px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.card.pad0{padding:0;overflow:hidden}
.card h3{font:700 15px 'Barlow';margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-weight:500;color:var(--mut);font-size:12px}
.sec{margin:18px 0 8px;font:800 13px 'Barlow';letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.hero{background:linear-gradient(135deg,#2B2F35 0%,#1C1F24 70%);color:#fff;border-radius:18px;padding:18px 18px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(232,98,42,.35),transparent 70%)}
.hero .pn{font:800 22px/1.1 'Barlow Semi Condensed';letter-spacing:.3px}
.hero .ps{color:#B8BDC6;font-size:13px;margin-top:4px}
.hero .big{display:flex;align-items:baseline;gap:10px;margin-top:14px}
.hero .big b{font:800 54px/1 'Barlow Semi Condensed';letter-spacing:-1px}
.hero .big span{color:#B8BDC6;font-size:13px}
.hero .row{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.hero .row div{font-size:12px;color:#B8BDC6}.hero .row div b{display:block;color:#fff;font:700 18px 'Barlow Semi Condensed'}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F5B942,#E8622A)}
.bar.lt{background:var(--line)}.bar.lt i{background:var(--org)}
.bar.lt.g i{background:var(--grn)}.bar.lt.b i{background:var(--blu)}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;min-width:0}
.tile .l{font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.2px}
.tile .v{font:800 24px/1.1 'Barlow Semi Condensed';margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font:600 13px 'Barlow';color:var(--mut);margin-left:3px}
.tile .s{font-size:12px;color:var(--mut);margin-top:3px}
.tile.o .v{color:var(--org)}.tile.g .v{color:var(--grn)}.tile.b .v{color:var(--blu)}.tile.r .v{color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0;padding-top:0}
.kv b{font-weight:700;white-space:nowrap}
.kv .m{color:var(--mut);font-size:12px}
.krow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.krow:first-of-type{border-top:0}
.krow .n{font-weight:700}.krow .n small{font-weight:600;color:var(--mut);font-size:11px;margin-right:6px;padding:1px 6px;border-radius:6px;background:var(--soft)}
.krow .p{font:800 16px 'Barlow Semi Condensed';text-align:right}
.krow .d{grid-column:1/3;font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.krow .bar{grid-column:1/3;margin-top:4px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mut);border:1px solid var(--line)}
.chip.o{background:#FFF2EA;color:var(--org);border-color:#FBD5C2}.chip.g{background:#E8F6EE;color:var(--grn);border-color:#BFE6CF}.chip.r{background:#FDE8EB;color:var(--red);border-color:#F8C2CA}.chip.b{background:#E9F1FB;color:var(--blu);border-color:#C3D8F2}.chip.a{background:#FFF5E5;color:var(--amb);border-color:#F8DFB0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;white-space:nowrap}.tbl th.r{text-align:right}
.tbl tfoot td{font-weight:700;background:var(--soft)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--char);color:#fff;border-color:var(--char)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--org);color:#fff;font-weight:700;font-size:14px}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.blk{width:100%}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:39;width:54px;height:54px;border-radius:18px;background:var(--org);color:#fff;font-size:30px;line-height:1;box-shadow:0 8px 20px rgba(232,98,42,.4);display:grid;place-items:center}
.lab{font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 5px;display:block}
.inp{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;font-size:15px}
.inp:focus{outline:0;border-color:var(--org)}
textarea.inp{min-height:96px;resize:vertical}
.frow{display:flex;gap:10px}.frow>*{flex:1;min-width:0}
.empty{padding:26px 10px;text-align:center;color:var(--mut);font-size:14px}
.gl{padding:12px 0;border-top:1px solid var(--line)}
.gl:first-child{border-top:0;padding-top:0}
.gl .h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.gl .h b{color:var(--ink);font-size:14px}
.gl .b{margin-top:6px;white-space:pre-wrap;font-size:14px;line-height:1.5}
.gl .b.cl{max-height:4.6em;overflow:hidden;position:relative}
.gl .b.cl:after{content:'';position:absolute;left:0;right:0;bottom:0;height:1.6em;background:linear-gradient(transparent,#fff)}
.gl .more{font-size:12px;font-weight:700;color:var(--org);margin-top:4px}
.heat{display:grid;gap:2px;font-size:10px}
.heat .c{height:16px;border-radius:3px;background:var(--line)}
.heat .c.v{background:#2E9E5B}.heat .c.y{background:#8DD3A8}.heat .c.x{background:#F3A6AE}.heat .c.w{background:#EEF0F3}
.heat .n{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.heat .dh{font-size:9px;color:var(--mut);text-align:center}
/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(16,20,28,.55)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
#sheet .pn:before{content:'';display:block;width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
#sheet h2{font:800 20px 'Barlow Semi Condensed';margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
#sheet h2 button{font-size:24px;color:var(--mut);padding:0 4px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--char);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:70;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
svg.ch{width:100%;height:auto;display:block}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap;margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--mut);background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.warn{font-size:13px;color:#7A4A05;background:#FFF5E5;border:1px solid #F8DFB0;border-radius:10px;padding:9px 11px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{padding:7px 11px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px}
.sw button.on{border-color:var(--org);background:#FFF2EA;color:var(--org)}
.ava{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font:700 13px 'Barlow Semi Condensed';color:var(--char);flex:none;border:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .i{flex:1;min-width:0}.prow .i b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prow .i small{color:var(--mut);font-size:12px}
.prow .x{text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}.prow .x b{display:block;font:700 15px 'Barlow Semi Condensed';color:var(--ink)}
@media(min-width:900px){
  body{padding-bottom:20px;padding-left:var(--rail)}
  #hdr{padding-left:calc(var(--rail) + 16px)}
  #nav{top:0;bottom:0;right:auto;width:var(--rail);flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:92px 12px 12px;background:#fff}
  #nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:11px 12px;border-radius:12px}
  #nav button.on{background:#FFF2EA}
  .fab{right:28px;bottom:28px}
  #sheet .pn{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(640px,94vw);max-height:88vh;border-radius:20px;animation:none}
  #sheet .pn:before{display:none}
}
@media(max-width:700px){.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.hero .big b{font-size:46px}}
@media print{#nav,#hdr,.fab{display:none}body{padding:0;background:#fff}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>

<header id="hdr">
  <div class="lg">⚡</div>
  <div class="t"><b id="h_ad">Saha Takip</b><small id="h_alt">yükleniyor…</small></div>
  <div class="u" id="h_u"></div>
  <div class="dot" id="dot" title="senkron"></div>
</header>
<nav id="nav"></nav>
<main id="app"><div class="empty">Veri yükleniyor…</div></main>
<button class="fab" id="fab" title="Kayıt ekle" style="display:none">+</button>
<div id="sheet"><div class="bg"></div><div class="pn" id="sh_pn"></div></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
var BUILD='v3.2';
/* ============ temel ============ */
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pad=function(n){return (n<10?'0':'')+n;};
var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var ym=function(s){return (s||today()).slice(0,7);};
var dStr=function(s){if(!s)return '—';var p=s.slice(0,10).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:s;};
var dShort=function(s){var p=(s||'').slice(0,10).split('-');return p.length===3?(+p[2])+' '+AYK[+p[1]-1]:s;};
var AYK=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
var AYU=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var GUN=['Pz','Pt','Sa','Ça','Pe','Cu','Ct'];
var dim=function(y,m){return new Date(y,m,0).getDate();};
var addDays=function(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var dayDiff=function(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);};
var n0=function(v){v=+v;return isNaN(v)?0:v;};
var fmt=function(v,d){v=n0(v);return v.toLocaleString('tr-TR',{minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?0:d});};
var usd=function(v){return '$'+fmt(v,0);};
var pct=function(v){return fmt(v,1)+'%';};
var cur=function(v,c){return fmt(v,0)+' '+(c||'');};
var uid=function(p){return (p||'v')+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);};
var toastT;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2200);}

/* ============ oturum (portal) ============ */
function portalOturum(){try{var o=JSON.parse(localStorage.getItem('ae_portal')||'null'),S=o&&o.S;if(!S)return null;
  var iz=(S.izinler&&S.izinler.saha)||[];var admin=!!S.ka;
  return {admin:admin,izin:iz,user:(S.ad||S.isim||S.kad||S.kul||''),projeler:(S.projeler&&S.projeler.length)?S.projeler:((S.izinler&&S.izinler.sahaProje)||[])};}catch(e){return null;}}
var OT=portalOturum()||{admin:true,izin:[],user:'yerel',projeler:[]};
var PARASAL=OT.admin||OT.izin.indexOf('parasal')>=0||OT.izin.indexOf('od_hakedis')>=0;
var CAN=function(k){return OT.admin||OT.izin.indexOf(k)>=0;};

/* ============ proje / API ============ */
var API=(function(){try{return localStorage.getItem('sh2:n8n')||'https://xbay.app.n8n.cloud/webhook';}catch(e){return 'https://xbay.app.n8n.cloud/webhook';}})();
/* proje: yeni.html'den bağımsız (v3:proje); varsayılan SHAMS-1 */
var PROJE=(function(){try{var q=new URLSearchParams(location.search).get('proje');if(q){localStorage.setItem('v3:proje',q);return q;}return localStorage.getItem('v3:proje')||'tr1';}catch(e){return 'tr1';}})();
var NS='SHAMS1-'+PROJE;
var DEV=(function(){try{var d=localStorage.getItem('v3:dev');if(!d){d=uid('d');localStorage.setItem('v3:dev',d);}return d;}catch(e){return 'd0';}})();
var PROJELER=[{id:'tr1',ad:'SHAMS-1 GES',renk:'#E8622A'}];
function projeAd(){var p=PROJELER.filter(function(x){return x.id===PROJE;})[0];return p?p.ad:PROJE;}

/* ============ veri deposu ============ */
var RAW={},MEMO={},META={};
function J(k,def){if(k in MEMO)return MEMO[k];var v=RAW[k];if(v==null){MEMO[k]=def;return def;}try{MEMO[k]=JSON.parse(v);}catch(e){MEMO[k]=def;}return MEMO[k];}
function keys(pre){var o=[];for(var k in RAW)if(k.indexOf(pre)===0&&RAW[k]!=null)o.push(k);return o.sort();}
function cacheSave(){try{localStorage.setItem('v3:kv:'+NS,JSON.stringify({t:Date.now(),raw:RAW,meta:META}));}catch(e){}}
function cacheLoad(){try{var o=JSON.parse(localStorage.getItem('v3:kv:'+NS)||'null');if(o&&o.raw){RAW=o.raw;META=o.meta||{};MEMO={};return o.t;}}catch(e){}return 0;}
var OUT=(function(){try{return JSON.parse(localStorage.getItem('v3:out:'+NS)||'[]');}catch(e){return [];}})();
function outSave(){try{localStorage.setItem('v3:out:'+NS,JSON.stringify(OUT));}catch(e){}}
function dot(s){$('dot').className='dot '+s;$('dot').title=OUT.length?OUT.length+' kayıt gönderilecek':'senkron';}
function put(k,v){ if(k.indexOf('v3:')!==0){toast('Yalnız v3: anahtarları yazılabilir');return;}
  var dv=v===null?null:JSON.stringify(v); RAW[k]=dv; delete MEMO[k]; META[k]={t:Date.now(),by:OT.user};
  OUT=OUT.filter(function(x){return x.anahtar!==k;}); OUT.push({anahtar:k,deger:dv,sil:v===null,ts:Date.now()}); outSave(); cacheSave(); dot('busy'); flush(); }
var FL=false;
function flush(){ if(FL||!OUT.length||!navigator.onLine){if(!OUT.length)dot(navigator.onLine?'ok':'off');return;} FL=true; var batch=OUT.slice(0,40);

$('fab').addEventListener('click',function(){if(VIEW==='gunluk')gunSheet();else if(VIEW==='kalem'){var h='<h2>İlerleme ekle<button data-close>×</button></h2>'+D.items.map(function(it){return '<div class="krow" data-k="'+it.id+'"><div class="n"><small>'+DIS[it.dis]+'</small>'+esc(it.ad)+'</div><div class="p">'+pct(it.pct)+'</div></div>';}).join('');sheet(h);}});
$('sh_pn').addEventListener('click',function(e){var k=e.target.closest('.krow');if(k&&k.getAttribute('data-k')){kalemSheet(k.getAttribute('data-k'));}});
$('app').addEventListener('click',function(e){var t=e.target;
  var k=t.closest('[data-k]');if(k){kalemSheet(k.getAttribute('data-k'));return;}
  var s=t.closest('[data-s]');if(s){var v=s.getAttribute('data-s');if(VIEW==='kalem')SUB.k=v;else if(VIEW==='ekip')SUB.e=v;else if(VIEW==='gunluk')SUB.g=v;else if(VIEW==='para')SUB.p=v;render();return;}
  var a=t.closest('[data-ay]');if(a){SUB.ay=a.getAttribute('data-ay');render();return;}
  if(t.closest('[data-all]')){SUB.all=1;render();return;}
  if(t.closest('[data-mall]')){SUB.mall=1;render();return;}
  var m=t.closest('[data-more]');if(m){var b=m.previousElementSibling;b.classList.remove('cl');m.remove();return;}
  var d=t.closest('[data-del]');if(d){if(!confirm('Bu girişi silmek istiyor musunuz?'))return;put('v3:ilh:'+d.getAttribute('data-del'),null);compute();render();toast('Silindi');return;}
});
$('app').addEventListener('input',function(e){if(e.target.id==='e_q'){SUB.q=e.target.value;var el=e.target;render();var q=$('e_q');q.focus();q.setSelectionRange(q.value.length,q.value.length);}});
window.addEventListener('hashchange',function(){var v=location.hash.replace('#','');if(v&&v!==VIEW){VIEW=v;render();}});

  if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
