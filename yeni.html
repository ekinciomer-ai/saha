<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#E8622A">
<title>SHAMS · Saha</title>
<script>
/* Aksaray Enerji Portal girişi zorunlu — rol/yetki portaldan gelir, burada giriş yapılmaz */
(function(){try{var o=JSON.parse(localStorage.getItem('ae_portal')||'null'),S=o&&o.S;
if(S&&Date.now()<(o.son||0)&&(S.ka||(S.anahtarlar&&S.anahtarlar.saha)))return;}catch(e){}
location.replace((location.hostname.slice(-9)==='github.io'?'/aesun/portal/':location.hostname.indexOf('portal.')===0?'/':'/portal/')+'?git=saha');})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF7;--ink:#1A1D1F;--mut:#6B7177;--line:#E7E4DC;--org:#E8622A;--grn:#2E7D46;--red:#D23B2B;--blu:#3f6fb0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.cond{font-family:'Barlow Semi Condensed','Barlow',sans-serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}

/* ---- giriş ---- */
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}
#login .lg{width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,#E8833A,#E50E2A);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;margin-bottom:16px}
#login h1{font:800 26px/1 'Barlow Semi Condensed';letter-spacing:.4px}
#login p{color:var(--mut);font-size:13px;margin:6px 0 22px}
#login .roles{display:flex;gap:8px;width:100%;max-width:360px;margin-bottom:14px}
#login .roles button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 8px;font:700 14px 'Barlow';color:var(--ink)}
#login .roles button.on{border-color:var(--org);background:#FFF2EA;color:var(--org)}
#login .pin{width:100%;max-width:360px}
#login .pin input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:14px;text-align:center;letter-spacing:4px;font-weight:700;margin-bottom:10px}
#login .go{width:100%;max-width:360px;border:0;border-radius:12px;background:var(--org);color:#fff;font:800 16px 'Barlow';padding:15px}
#login .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;font-weight:600}

/* ---- app shell ---- */
#app{display:flex;flex-direction:column;min-height:100vh}
#hd{background:var(--org);color:#fff;padding:16px 16px 14px calc(16px);padding-top:calc(14px + env(safe-area-inset-top,0))}
#hd .r1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
#hd .pj{font:800 20px/1 'Barlow Semi Condensed';letter-spacing:.3px}
#hd .zn{display:inline-flex;align-items:center;gap:6px;margin-top:5px;background:rgba(255,255,255,.2);border-radius:7px;padding:3px 9px;font:700 12px 'Barlow Semi Condensed';border:0;color:#fff}
#hd .hact{display:flex;gap:7px;flex:0 0 auto}
#hd .hb{width:34px;height:34px;border:0;border-radius:9px;background:rgba(255,255,255,.18);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
#hd .rail{margin-top:15px}
#hd .rail .lab{display:flex;justify-content:space-between;font:600 12px/1 'Barlow';opacity:.95;margin-bottom:6px}
#hd .rail .bar{height:13px;border-radius:3px;background:rgba(0,0,0,.2);overflow:hidden}
#hd .rail .bar i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .4s}
#hd .rail .big{font:800 16px/1 'Barlow Semi Condensed';margin-top:7px}
#hd .rail .big small{font:600 12px 'Barlow';opacity:.9}
#body{flex:1;overflow-y:auto;padding:14px 14px 92px}
#nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--line);display:flex;padding:8px 2px calc(8px + env(safe-area-inset-bottom,0));z-index:40}
#nav button{flex:1;border:0;background:none;font:600 10px/1.3 'Barlow';color:#9aa0a6;display:flex;flex-direction:column;gap:4px;align-items:center;padding:3px 0}
#nav button i{font-size:19px;font-style:normal}
#nav button.on{color:var(--org)}

/* ---- kartlar ---- */
.card{background:#fff;border:1.5px solid var(--line);border-radius:5px;padding:14px;margin-bottom:12px}
.ch{font:700 13px/1 'Barlow Semi Condensed';letter-spacing:.3px;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}
.ch .tag{background:var(--ink);color:#fff;border-radius:5px;padding:3px 9px;font:700 12px 'Barlow Semi Condensed'}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.stat{border:1.5px solid var(--line);border-radius:5px;padding:13px;background:#fff}
.stat .k{font:600 12px 'Barlow';color:var(--mut)}
.stat .v{font:800 29px/1 'Barlow Semi Condensed';margin-top:7px;letter-spacing:.3px}
.stat .s{font:500 11px 'Barlow';color:#9aa0a6;margin-top:5px}
.stat.go .v{color:var(--grn)}.stat.mo .v{color:var(--org)}.stat.rd .v{color:var(--red)}
.mini{border:1.5px solid var(--line);border-radius:5px;padding:11px;background:#fff}
.mini .k{font:600 11px 'Barlow';color:var(--mut)}
.mini .v{font:800 18px/1 'Barlow Semi Condensed';margin-top:5px}
.metrics{display:flex;border:1.5px solid var(--line);border-radius:5px;background:#fff;margin-bottom:12px}
.metrics div{flex:1;padding:11px 6px;text-align:center;border-right:1.5px solid #EEEBE3}
.metrics div:last-child{border-right:0}
.metrics .mv{font:800 17px/1 'Barlow Semi Condensed'}
.metrics .mk{font:500 10px 'Barlow';color:#8a9099;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #F1EEE7;font-size:14px}
.row:first-of-type{border-top:0}
.empty{color:#9aa0a6;font-size:13px;text-align:center;padding:16px 0}
.more{width:100%;margin-top:10px;border:0;background:#F4F1EA;color:#43484d;border-radius:6px;padding:11px;font:700 13px 'Barlow'}
.prim{width:100%;border:0;border-radius:7px;background:var(--org);color:#fff;font:800 16px 'Barlow';padding:14px;margin-top:2px}
.prim:active{filter:brightness(.95)}
.ghost{border:1.5px solid var(--line);background:#fff;color:#43484d;border-radius:8px;padding:9px 13px;font:700 13px 'Barlow'}

/* günlük */
.gun{padding:11px 0;border-top:1px solid #F1EEE7;position:relative}
.gun:first-of-type{border-top:0}
.gd{font:700 12px 'Barlow';color:var(--org);margin-bottom:3px}
.gt{font:400 13.5px/1.5 'Barlow';color:#43484d;word-break:break-word}
.eb{display:inline-block;margin-top:6px;font:700 11px 'Barlow';color:#9a5b09;background:#FDF0DC;border-radius:6px;padding:2px 8px}
.del{position:absolute;right:0;top:11px;border:0;background:none;color:var(--red);font-size:12px;font-weight:600}

/* ilerleme bar */
.pr{margin-bottom:13px}
.prt{display:flex;justify-content:space-between;font:600 13px 'Barlow'}
.prt small{color:#9aa0a6;font-weight:500;font-size:11px}
.trk{height:9px;border-radius:5px;background:#EEEBE3;overflow:hidden;margin:6px 0 4px}
.trk i{display:block;height:100%;border-radius:5px}
.fm{background:linear-gradient(90deg,#E8622A,#f0a35f)}.fe{background:linear-gradient(90deg,#3f6fb0,#7ba2d8)}
.prx{display:flex;justify-content:space-between;align-items:center}
.prp{font:700 13px 'Barlow Semi Condensed'}
.pedit{width:66px;border:1.5px solid var(--line);border-radius:7px;padding:7px;text-align:center;font-weight:700}
.pit{padding:11px 0;border-bottom:1px solid var(--line)}
.pit:last-child{border-bottom:0}
.pit .prt small .dim,.dim{color:#9aa0a6;font-weight:600}
.ent{display:flex;align-items:center;gap:9px;margin:9px 0 5px}
.prange{flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:5px;background:#EEEBE3;outline:none;margin:0}
.prange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--org);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
.prange::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--org);border:3px solid #fff;cursor:pointer}
.pnum{width:82px;border:1.5px solid var(--line);border-radius:8px;padding:9px 6px;text-align:center;font:700 15px 'Barlow';color:#2b2f33}
.pdone{border:1.5px solid var(--org);background:#fff;color:var(--org);border-radius:8px;padding:9px 12px;font:700 13px 'Barlow Semi Condensed';white-space:nowrap;cursor:pointer}
.pdone.on{background:#1e8e4e;border-color:#1e8e4e;color:#fff}
.pstat{font:600 12px 'Barlow';color:#6b7280}
.pstat .ppct{color:var(--org);font-weight:800}
.ozg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ozv{font:800 26px 'Barlow Semi Condensed';color:var(--org);line-height:1.1}
.ozk{font:600 11px 'Barlow';color:#6b7280;margin-top:2px}
.ozk small{display:block;color:#9aa0a6;font-weight:500;font-size:10px}
.pdet{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
.pdet table{border-collapse:collapse;font:600 11px 'Barlow';white-space:nowrap;width:100%}
.pdet th,.pdet td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line)}
.pdet th{background:#f6f3ef;font:700 10px 'Barlow Semi Condensed';color:#5a636d}
.pdet td:first-child,.pdet th:first-child{text-align:left}
.pdet tr.mhd td{background:#eef7f1;font-weight:800;color:#1e8e4e;text-align:left}
.pit.ok .pstat .ppct{color:#1e8e4e}
.pit.ok .prange{background:#d7f0e0}
.pit.ok .prange::-webkit-slider-thumb{background:#1e8e4e}
.pit.ok .prange::-moz-range-thumb{background:#1e8e4e}

/* formlar */
.frow{display:flex;gap:8px;margin-bottom:8px}
.frow>*{flex:1;min-width:0}
#app input,#app select,#app textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:11px;background:#fff;color:var(--ink)}
#app textarea{min-height:66px;resize:vertical;margin-bottom:8px}
details.eng{margin:4px 0 10px}
details.eng summary{color:var(--mut);font:600 13px 'Barlow';padding:6px 0;cursor:pointer}
details.acc{background:#fff;border:1.5px solid var(--line);border-radius:5px;margin-bottom:11px;overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px;gap:10px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'▾';color:var(--org);font-size:13px;margin-left:2px;transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(180deg)}
details.acc[open]>summary{border-bottom:1.5px solid var(--line)}
.accl{display:flex;flex-direction:column;gap:2px;flex:1}
.accl b{font:700 15px 'Barlow Semi Condensed';letter-spacing:.3px}
.accl small,.accr small{color:var(--mut);font:600 11px 'Barlow'}
.accr{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font:800 17px 'Barlow Semi Condensed';color:var(--org)}
.accb{padding:14px}
.hkwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;border:1px solid var(--line);border-radius:5px}
.hktab{border-collapse:collapse;font:600 12px 'Barlow';white-space:nowrap;min-width:100%}
.hktab th,.hktab td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line)}
.hktab th{background:#f6f3ef;font:700 11px 'Barlow Semi Condensed';letter-spacing:.3px;color:#5a636d;position:sticky;top:0}
.hktab th small{display:block;font:500 9px 'Barlow';color:#9aa0a6}
.hktab td.hl,.hktab th.hl{text-align:left;position:sticky;left:0;background:#fff;font-weight:700;color:#2b2f33;box-shadow:1px 0 0 var(--line)}
.hktab th.hl{background:#f6f3ef}
.hktab td.tp,.hktab th.tp{font-weight:800;color:var(--org);background:#FFF8F2}
.hktab tr.sep td{border-bottom:2px solid #d8d2ca}
.hktab tr.khd td{background:#f6f3ef;text-align:left;font:700 11px 'Barlow Semi Condensed';letter-spacing:.4px;color:#8a6240;padding:8px 9px}
.hktab tr.net td{background:#eafaf0;font-weight:800;color:#1e8e4e}
.hktab tr.net td.hl{color:#1e8e4e}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:#5a636d;margin:4px 0 10px}
.chk input{width:auto}

/* ödeme liste */
.odp{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;border-top:1px solid #F1EEE7;background:none;padding:12px 0;text-align:left}
.odp:first-of-type{border-top:0}
.odn{display:flex;flex-direction:column;font:600 14px 'Barlow'}
.odn small{font:500 11px 'Barlow';color:#9aa0a6;margin-top:2px}
.odk{text-align:right;font:800 15px 'Barlow Semi Condensed';white-space:nowrap}
.odk small{display:block;font:600 10px 'Barlow';color:#9aa0a6}
.odk.pos{color:var(--org)}

/* puantaj */
.phd{display:flex;align-items:center;justify-content:space-between}
.phd b{font:700 15px 'Barlow Semi Condensed'}
.plg{font:500 11px 'Barlow';color:#9aa0a6;margin-top:6px}
.pwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.ptbl{border-collapse:collapse;font-size:12px}
.ptbl th{font:700 10px 'Barlow';color:#8a9099;padding:4px 2px;text-align:center;position:sticky;top:0;background:#fff}
.ptbl th.sun,.ptbl td.sun{color:var(--red)}
.ptbl th.tdy{color:#fff;background:var(--org)!important;border-radius:4px}
.pname{position:sticky;left:0;background:#fff;z-index:2;text-align:left!important;min-width:94px;max-width:94px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;padding:5px 7px!important;box-shadow:2px 0 4px rgba(0,0,0,.04)}
.pc{width:27px;height:31px;text-align:center;border:1px solid #F0EEE8;font:700 12px 'Barlow Semi Condensed';position:relative;user-select:none;cursor:pointer}
.pg{position:absolute;left:2px;bottom:2px;width:6px;height:6px;border-radius:50%}
.ptot{font:800 12px 'Barlow Semi Condensed';text-align:center;background:#FAF8F3;min-width:34px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
#sheet.off{display:none}
#sbg{position:absolute;inset:0;background:rgba(10,15,20,.45)}
#sbox{position:relative;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh b{font:800 17px 'Barlow Semi Condensed'}
.sh button{border:0;background:none;font-size:20px;color:var(--mut)}
.ch2{font:700 12px 'Barlow';color:var(--mut);margin:12px 0 6px}
.gos{display:flex;flex-wrap:wrap;gap:7px}
.gos button{border:2px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;font:600 12.5px 'Barlow';color:#43484d}
.gos button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sts button{min-width:44px;border:0;border-radius:8px;padding:10px;font:800 14px 'Barlow Semi Condensed'}
.sts button.on{outline:3px solid var(--ink);outline-offset:1px}

/* daha menü */
.mod{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:12px;margin-bottom:8px;text-align:left}
.mic{width:38px;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#F4F1EA;font-size:18px}
.mtx{flex:1}.mtx b{font:700 14px 'Barlow'}.mtx small{display:block;font-size:11.5px;color:#9aa0a6}
.pswitch{border:1.5px solid var(--line);background:#fff;color:#9aa0a6;border-radius:999px;padding:6px 13px;font:700 12px 'Barlow';min-width:68px}
.pswitch.on{background:var(--grn);color:#fff;border-color:var(--grn)}

/* durum noktası + toast */
#sync{position:fixed;right:12px;bottom:78px;z-index:45;display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:999px;padding:6px 11px 6px 9px;font:700 11px 'Barlow';box-shadow:0 4px 14px rgba(0,0,0,.25)}
#sync i{width:9px;height:9px;border-radius:50%;background:#8a93a3;display:inline-block}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(16px);z-index:200;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font:600 13.5px 'Barlow';opacity:0;pointer-events:none;transition:.22s;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:620px){
  body{background:#EBE9E3}
  #app{max-width:560px;margin:0 auto;background:var(--bg);box-shadow:0 0 50px rgba(0,0,0,.1);min-height:100vh}
  #nav{left:50%;transform:translateX(-50%);width:100%;max-width:560px}
  #sync{right:calc(50vw - 280px + 12px)}
  #toast{bottom:120px}
  #login{max-width:560px;margin:0 auto;box-shadow:0 0 50px rgba(0,0,0,.1)}
}
</style>
</head>
<body>

<div id="app" class="hidden">
  <div id="hd">
    <div class="r1">
      <div>
        <div class="pj" id="h_pj">SHAMS-1 GES</div>
        <div class="who" id="h_who" style="font:600 11px Barlow;color:#ffe3d0;opacity:.95;margin-top:2px"></div>
      </div>
      <div class="hact">
        <button class="hb" id="h_sync" title="Yenile">↻</button>
        <button class="hb" id="h_out" title="Çıkış">⏻</button>
      </div>
    </div>
    <div class="rail">
      <div class="lab"><span>Toplam ilerleme</span><span id="h_pct">%0</span></div>
      <div class="bar"><i id="h_bar" style="width:0%"></i></div>
      <div class="big"><span>Mekanik <b id="h_mek">%0</b></span> <small style="margin-left:10px">Elektrik <b id="h_elk">%0</b></small></div>
    </div>
  </div>
  <div id="body"></div>
  <nav id="nav">
    <button data-t="bugun" class="on"><i>◧</i>Bugün</button>
    <button data-t="ilerleme"><i>▤</i>İlerleme</button>
    <button data-t="gunluk"><i>✎</i>Günlük</button>
    <button data-t="odeme"><i>₼</i>Ödemeler</button>
    <button data-t="puantaj"><i>☷</i>Puantaj</button>
    <button data-t="daha"><i>⋯</i>Diğer</button>
  </nav>
</div>

<div id="sync" class="hidden"><i id="syncdot"></i><span id="synctx">n8n</span></div>

/* kota (ölçek): yerel depo dolunca aktif OLMAYAN + senkronu biten projelerin
   yerel kopyasını sil; kalıcı veri n8n'de güvende, proje açılınca geri çekilir */
function projeIdFromKey(sk){ if(!sk||sk.indexOf('sh2:')!==0)return null; var r=sk.slice(4),i=r.indexOf(':'); return i<0?null:r.slice(0,i); }
function projeSenkronBekliyor(id){ try{var b=localStorage.getItem('sh2:'+id+':__outbox'); if(!b)return false; var o=JSON.parse(b); return !!(o&&Object.keys(o).length); }catch(e){return false;} }
function evictInactive(){ var drop={},removed=0; try{
    for(var i=0;i<localStorage.length;i++){ var pid=projeIdFromKey(localStorage.key(i)); if(pid&&pid!==PROJE&&!projeSenkronBekliyor(pid))drop[pid]=1; }
    if(!Object.keys(drop).length)return 0;
    var del=[]; for(var j=0;j<localStorage.length;j++){ var k2=localStorage.key(j); if(drop[projeIdFromKey(k2)])del.push(k2); }
    del.forEach(function(k){ try{localStorage.removeItem(k);removed++;}catch(e){} });
  }catch(e){} return removed; }
function set(k,v){ D[k]=v; var s=JSON.stringify(v); try{localStorage.setItem(lkey(k),s);}catch(e){ if(/quota|exceed/i.test((e&&(e.name+' '+e.message))||'')&&evictInactive()>0){ try{localStorage.setItem(lkey(k),s);}catch(e2){} } } N8N.queue(k,v); return true; }
function del(k){ delete D[k]; try{localStorage.removeItem(lkey(k));}catch(e){} N8N.queue(k,null); }
function keys(prefix){ var out=[],seen={}; for(var kk in D){if(kk.indexOf(prefix)===0){out.push(kk);seen[kk]=1;}} try{for(var i=0;i<localStorage.length;i++){var sk=localStorage.key(i),pf='sh2:'+PROJE+':'; if(sk&&sk.indexOf(pf)===0){var kn=sk.slice(pf.length); if(kn.indexOf(prefix)===0&&!seen[kn]){out.push(kn);seen[kn]=1;}}}}catch(e){} return out; }
function getAll(prefix){ var o={}; keys(prefix).forEach(function(k){o[k]=get(k);}); return o; }

/* ---- n8n senkron: KALICI KUYRUK (outbox) — kayıt ASLA ağa bağlı değil ----
   İlke: her yazı önce cihaza (localStorage) anında yazılır → arayüz hiç donmaz.
   Değişiklik ayrıca kalıcı bir kuyruğa (localStorage __outbox) düşer; sayfa
   kapansa/çevrimdışı olsa bile kuyruk kalır ve bağlantı gelince yeniden denenir
   → veri kaybı olmaz. pull, kuyrukta bekleyen yerel anahtarları ASLA ezmez. */
var N8N={ dev:(localStorage.getItem('sh2:dev')||('c'+Math.floor(1000+Math.random()*9000))),
  box:{}, lmt:{}, t:null, backoff:0, sending:false,
  proje:function(){return 'SHAMS1-'+PROJE;},
  bkey:function(){return 'sh2:'+PROJE+':__outbox';},
  lkeyL:function(){return 'sh2:'+PROJE+':__lmt';},
  skip:function(k){return !k||k==='sess'||String(k).indexOf('__')===0;},
  loadBox:function(){ try{N8N.box=JSON.parse(localStorage.getItem(N8N.bkey())||'{}')||{};}catch(e){N8N.box={};}
                      try{N8N.lmt=JSON.parse(localStorage.getItem(N8N.lkeyL())||'{}')||{};}catch(e){N8N.lmt={};} },
  saveBox:function(){ try{localStorage.setItem(N8N.bkey(),JSON.stringify(N8N.box));}catch(e){} },
  saveLmt:function(){ try{localStorage.setItem(N8N.lkeyL(),JSON.stringify(N8N.lmt));}catch(e){} },
  mark:function(k){ if(N8N.skip(k))return; N8N.lmt[k]=Date.now(); },
  pend:function(){ return Object.keys(N8N.box).length; },
  dot:function(s){var i=$('syncdot'),x=$('synctx');var c={ok:'#49d496',busy:'#FFC400',off:'#8a93a3',err:'#ff6a56'}[s]||'#8a93a3';if(i)i.style.background=c;if(x){var n=N8N.pend();x.textContent='n8n '+({ok:'✓',busy:'…',off:'·',err:'!'}[s]||'')+(n?(' '+n):'');}},
  schedule:function(ms){ clearTimeout(N8N.t); N8N.t=setTimeout(N8N.flush, ms||800); },
  /* bir anahtarı kalıcı kuyruğa koy (v===null → silme damgası) */
  queue:function(k,v){ if(N8N.skip(k))return; N8N.box[k]={d:(v===null?null:JSON.stringify(v)),ts:Date.now()}; N8N.mark(k); N8N.saveBox(); N8N.saveLmt(); N8N.dot(navigator.onLine?'busy':'off'); N8N.schedule(800); },
  CHUNK:40,  /* büyük yüklemeler tek dev istek yerine parça parça → hep tam gider */
  flush:function(){
    if(N8N.sending)return;
    var all=Object.keys(N8N.box); if(!all.length){N8N.dot('ok');return;}
    if(!navigator.onLine){N8N.dot('off');N8N.schedule(6000);return;}
    var ks=all.slice(0,N8N.CHUNK);  /* bu turda yalnızca ilk parça */
    N8N.sending=true; N8N.dot('busy');
    var sent={}; var items=ks.map(function(k){ sent[k]=N8N.box[k].ts; return {anahtar:k,deger:N8N.box[k].d,sil:(N8N.box[k].d===null),ts:N8N.box[k].ts}; });
    fetch(N8N_BASE+'/saha-set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proje:N8N.proje(),cihaz:N8N.dev,items:items})})
      .then(function(r){ if(!r.ok)throw 0;
        ks.forEach(function(k){ if(N8N.box[k]&&N8N.box[k].ts===sent[k]) delete N8N.box[k]; }); /* bu arada gelen yeni yazılar kuyrukta kalır */
        N8N.saveBox(); N8N.sending=false; N8N.backoff=0;
        if(N8N.pend()){N8N.dot('busy');N8N.schedule(300);} else N8N.dot('ok');  /* kalan parçaları gönder */
      })
      .catch(function(){ N8N.sending=false; N8N.dot('err'); N8N.backoff=Math.min((N8N.backoff||1500)*2,30000); N8N.schedule(N8N.backoff); });
  },
  /* kapanış/arka plan: kapanan sekme bile kuyruğu göndersin (onay beklemez; kuyruk temizlenmez) */
  beacon:function(){ try{ var ks=Object.keys(N8N.box); if(!ks.length||!navigator.sendBeacon)return;
    var items=ks.map(function(k){return {anahtar:k,deger:N8N.box[k].d,sil:(N8N.box[k].d===null),ts:N8N.box[k].ts};});
    navigator.sendBeacon(N8N_BASE+'/saha-set', new Blob([JSON.stringify({proje:N8N.proje(),cihaz:N8N.dev,items:items})],{type:'application/json'})); }catch(e){} },
  pull:function(cb){ if(!navigator.onLine){cb&&cb();return;} N8N.dot('busy');
    fetch(N8N_BASE+'/saha-get?proje='+encodeURIComponent(N8N.proje())).then(function(r){return r.ok?r.json():null;}).then(function(rows){
      try{ var arr=Array.isArray(rows)?rows:(rows&&rows.data)||[]; arr.forEach(function(row){ var k=row.anahtar,dv=row.deger;
        if(!k||N8N.skip(k))return; if(N8N.box[k])return; /* yerelde bekleyen değişikliği EZME */
        var st=row.guncellendi?Date.parse(row.guncellendi):0; if(N8N.lmt[k]&&st&&st<N8N.lmt[k])return; /* yereldeki daha yeni → EZME */
        if(N8N.lmt[k]&&!st)return; /* sunucu zamanı yok ama yerelde yeni edit var → koru */
        var val; try{val=JSON.parse(dv);}catch(e){val=dv;}
        if(val===null){ delete D[k]; try{localStorage.removeItem(lkey(k));}catch(e){} } /* silme damgası */
        else { D[k]=val; try{localStorage.setItem(lkey(k),JSON.stringify(val));}catch(e){} }
      }); }catch(e){}
      N8N.dot(N8N.pend()?'busy':'ok'); cb&&cb();
    }).catch(function(){N8N.dot('off');cb&&cb();}); },
  /* tam yedek: tüm anahtarları kalıcı kuyruğa koy → güvenli, yeniden denemeli gönderim */
  snapshot:function(){ var all=getAll(''); var now=Date.now(); Object.keys(all).forEach(function(k){ if(!N8N.skip(k)){ N8N.box[k]={d:JSON.stringify(all[k]),ts:now}; N8N.lmt[k]=now; } }); N8N.saveBox(); N8N.saveLmt(); N8N.flush(); }
};
try{localStorage.setItem('sh2:dev',N8N.dev);}catch(e){}
N8N.loadBox();
window.addEventListener('online',function(){N8N.backoff=0;N8N.schedule(300);});
window.addEventListener('offline',function(){N8N.dot('off');});
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden')N8N.beacon(); else N8N.schedule(300); });
window.addEventListener('pagehide',function(){N8N.beacon();});

/* ---- FOTO/PDF DEPOSU: yerel IndexedDB + n8n saha_foto (istek üzerine) ----
   Belgeler ana veriden (saha_kv) AYRI tutulur; sadece kayıtta küçük fotoId referansı. */
var PH={ db:null, _s:false, box:[],
  bkey:function(){return 'sh2:'+PROJE+':__fotobox';},
  loadBox:function(){ try{PH.box=JSON.parse(localStorage.getItem(PH.bkey())||'[]')||[];}catch(e){PH.box=[];} },
  saveBox:function(){ try{localStorage.setItem(PH.bkey(),JSON.stringify(PH.box));}catch(e){} },
  open:function(cb){ if(PH.db){cb(PH.db);return;} try{var rq=indexedDB.open('sh2foto',1);
    rq.onupgradeneeded=function(e){try{e.target.result.createObjectStore('f');}catch(x){}};
    rq.onsuccess=function(e){PH.db=e.target.result;cb(PH.db);}; rq.onerror=function(){cb(null);}; }catch(e){cb(null);} },
  idbPut:function(fid,data,cb){ PH.open(function(db){ if(!db){cb&&cb(false);return;} try{var t=db.transaction('f','readwrite');t.objectStore('f').put(data,fid);t.oncomplete=function(){cb&&cb(true);};t.onerror=function(){cb&&cb(false);};}catch(e){cb&&cb(false);} }); },
  idbGet:function(fid,cb){ PH.open(function(db){ if(!db){cb(null);return;} try{var r=db.transaction('f','readonly').objectStore('f').get(fid);r.onsuccess=function(){cb(r.result||null);};r.onerror=function(){cb(null);};}catch(e){cb(null);} }); },
  save:function(data){ if(!data)return ''; var fid='ph'+Date.now()+Math.floor(Math.random()*1000); PH.idbPut(fid,data); PH.box.push(fid); PH.saveBox(); setTimeout(PH.flush,200); return fid; },
  put:function(fid,data,cb){ if(!fid||!data){cb&&cb(false);return;} PH.idbPut(fid,data,function(){ if(PH.box.indexOf(fid)<0){PH.box.push(fid);PH.saveBox();} cb&&cb(true); }); },
  get:function(fid,cb){ if(!fid){cb(null);return;} PH.idbGet(fid,function(d){ if(d){cb(d);return;} PH.fetch(fid,cb); }); },
  fetch:function(fid,cb){ if(!navigator.onLine){cb(null);return;}
    fetch(N8N_BASE+'/foto-get?proje='+encodeURIComponent(N8N.proje())+'&fid='+encodeURIComponent(fid)).then(function(r){return r.ok?r.json():null;}).then(function(rows){var arr=Array.isArray(rows)?rows:(rows&&rows.data)||[];var v=arr[0]&&arr[0].veri;if(v){PH.idbPut(fid,v);cb(v);}else cb(null);}).catch(function(){cb(null);}); },
  flush:function(){ if(PH._s||!navigator.onLine||!PH.box.length)return; var fid=PH.box[0];
    PH.idbGet(fid,function(data){ if(!data){PH.box.shift();PH.saveBox();PH.flush();return;}
      PH._s=true; var tur=(String(data).indexOf('application/pdf')>=0?'pdf':'img');
      fetch(N8N_BASE+'/foto-set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proje:N8N.proje(),items:[{fid:fid,veri:data,tur:tur}]})})
        .then(function(r){PH._s=false; if(r.ok){PH.box.shift();PH.saveBox(); if(PH.box.length)setTimeout(PH.flush,300);} else setTimeout(PH.flush,6000);})
        .catch(function(){PH._s=false;setTimeout(PH.flush,8000);}); }); }
};

/* ---- mwp hakediş motoru (Asunim tipi: MEK/ELK $/MWp×ilerleme%, ROK/ROK-G/SBT birim×fiili adet) ---- */

  YER.m.forEach(function(r){var k=masaK(r),s=md[r[0]]||{},kol=r[7]||0,pan=masaPan(r); out[k]=out[k]||{masa:0,kol:0,pan:0,bitti:0,apl:0,rok:0,kolon:0,kons:0,panel:0};
    out[k].masa++; out[k].kol+=kol; out[k].pan+=pan; if(s.a)out[k].apl++; if(s.d)out[k].rok+=kol; if(s.k)out[k].kolon+=kol; if(s.s)out[k].kons++; if(s.p)out[k].panel+=pan;
    if(s.d&&s.k&&s.s&&s.p)out[k].bitti++; }); return out; }
/* bir masanın bileşen adetleri (tipe göre) — kullanıcı verdiği BOM */
function masaBOM(r){ var big=!r[5]; return big?{kolon:28,kiris:14,asik:32,payanda:14,ruzgarlik:12,panel:52}:{kolon:14,kiris:7,asik:16,payanda:7,ruzgarlik:6,panel:26}; }
function mwpMasaAgg(){ var a={apl:0,rok:0,kolon:0,kons:0,panel:0,dc:0,sbt:0,kiris:0,asik:0,payanda:0,ruzgarlik:0,masaBitti:0}; if(!mwpHasLayout())return a; var md=mdurum();
  YER.m.forEach(function(r){var s=md[r[0]]||{},kol=r[7]||0,pan=masaPan(r),bom=masaBOM(r); if(s.a)a.apl+=1; if(s.d)a.rok+=kol; if(s.k)a.kolon+=kol; if(s.s){a.kons+=1;a.kiris+=bom.kiris;a.asik+=bom.asik;a.payanda+=bom.payanda;a.ruzgarlik+=bom.ruzgarlik;} if(s.p)a.panel+=pan; if(s.e)a.dc+=1; if(s.b)a.sbt+=kol; if(s.d&&s.k&&s.s&&s.p)a.masaBitti+=1;}); return a; }
function mwpMan(kod){ var m=mwpIlp(); return (m[kod]!=null&&m[kod]!=='')?(+m[kod]||0):null; } /* kalem bazlı elle % / adet (MEK/ELK/ROK-G override) */
function mwpSay(){return get('mwpsay',{})||{};}                 /* kümülatif fiili sayaçlar — günlük girişlerden toplanır */
function mwpSayVal(m){var s=mwpSay();return (s[m]!=null&&s[m]!=='')?(+s[m]||0):null;}
function mwpAgg(){ /* efektif kümülatif adet: elle sayaç varsa o, yoksa haritadan */
  var a=mwpHasLayout()?mwpMasaAgg():{apl:0,rok:0,kolon:0,kons:0,panel:0,dc:0,sbt:0,masaBitti:0},s=mwpSay();
  ['apl','rok','kolon','kons','panel','dc','sbt'].forEach(function(k){ if(s[k]!=null&&s[k]!=='')a[k]=+s[k]||0; }); return a; }
function kid(k){return (k&&(k.id||k.kod))||'';}  /* benzersiz depolama anahtarı (ekranda k.kod gösterilir) */
function kalemById(id){var a=mwpKalemler();for(var i=0;i<a.length;i++)if(kid(a[i])===id)return a[i];return null;}
/* ham değer: başka kalemi izliyorsa (auto) ondan, değilse elle sayaç, yoksa haritadan (met), yoksa 0 */
function mwpKalemVal(k){ if(!k)return 0;
  if(k.auto){return mwpKalemVal(kalemById(k.auto));}
  var s=mwpSay(),ky=kid(k); if(s[ky]!=null&&s[ky]!=='')return +s[ky]||0;
  if(k.met&&mwpHasLayout()){var a=mwpMasaAgg();return +a[k.met]||0;}
  return 0; }
function mwpKalemAdet(k){ return mwpKalemVal(k); }
function mwpKalemPct(k){ if(!k)return 0; if(k.esas==='yuzde')return Math.max(0,Math.min(100,mwpKalemVal(k)));
  var pl=+k.plan||0,v=mwpKalemVal(k); return pl?Math.max(0,Math.min(100,v/pl*100)):(v>0?100:0); }

function mwpKalemHak(k){ if(!k)return 0; if(k.esas==='yuzde')return mwpKalemBedel(k)*mwpKalemPct(k)/100; return (+k.bf||0)*mwpKalemVal(k); }
function mwpToplamHak(){var t=0;mwpKalemler().forEach(function(k){if(!k.ayri)t+=mwpKalemHak(k);});return t;}
function mwpEkHak(){var t=0;mwpKalemler().forEach(function(k){if(k.ayri)t+=mwpKalemHak(k);});return t;}
function mwpGrupHak(g){var h=0,b=0;mwpKalemler().forEach(function(k){if(!k.ayri&&(k.grup||'')===g){h+=mwpKalemHak(k);b+=mwpKalemBedel(k);}});return {hak:h,bedel:b,pct:b?h/b*100:0};}
/* yerleşim dosyasını yükle: önce yerel önbellek, sonra sunucudan tazele (statik) */

}

var YERACIK=false;  /* yerleşim haritası açık mı (tıklayınca aç/kapa) */

function vYerlesim(){

function grp(ttl,items,base,artis,open){

    h+='<div class="pit'+(done2?' ok':'')+'" data-it="'+it.id+'" data-mik="'+(hasM?it.mik:0)+'">'
      +'<div class="prt"><span>'+esc(it.ad)+(it.mik?(' <small class="dim">· '+n0(it.mik)+' '+esc(it.birim||'')+'</small>'):'')+'</span><small>%'+(it.pur*100).toFixed(2).replace('.',',').replace(',00','')+(pr?(' · '+n0(u)+' $'):'')+'</small></div>'
      +(ROLE==='admin'?(
        '<div class="ent"><input type="range" class="prange" min="0" max="'+mx+'" step="'+stp+'" value="'+done+'">'
        +'<input type="number" class="pnum" inputmode="numeric" min="0" max="'+mx+'" value="'+done+'">'
        +'<button class="pdone'+(done2?' on':'')+'">'+(done2?'✓':'Bitti')+'</button></div>'
        +'<div class="pstat"><span class="ppct">%'+p.toFixed(0)+'</span>'+(hasM?(' · <span class="pfr">'+n0(done)+'</span> / '+n0(it.mik)+' '+esc(it.birim||'')):'')+'</div>'
      ):('<div class="trk"><i class="'+(it.dis==='MEK'?'fm':'fe')+'" style="width:'+Math.min(100,p)+'%"></i></div><div class="pstat"><span class="ppct">%'+p.toFixed(0)+'</span></div>'))

function hakDokum(){
  var hs=HAKED();
  var h='<div class="card"><div class="ch">Resmi hakediş dökümü ('+hs.length+')'+(ROLE==='admin'?'<button class="tag" style="border:0" id="hk_add">+ Hakediş</button>':'')+'</div>';

  if(!hs.length)return h+'<div class="empty">Hakediş kaydı yok</div></div>';
  var calc=hs.map(hakHesap);
  function sum(f){var t=0;calc.forEach(function(c){t+=c[f];});return t;}
  function kSum(key){var t=0;hs.forEach(function(r){t+=+(r.k&&r.k[key])||0;});return t;}
  var kused=KESK.filter(function(x){return hs.some(function(r){return Math.abs(+(r.k&&r.k[x[0]])||0)>0.001;});});
  var cols=hs.length;
  function rowF(label,f,cls){var s='<tr'+(cls?' class="'+cls+'"':'')+'><td class="hl">'+label+'</td>';calc.forEach(function(c){s+='<td>'+n0(c[f])+'</td>';});s+='<td class="tp">'+n0(sum(f))+'</td></tr>';return s;}
  function rowK(label,key){var s='<tr><td class="hl">'+esc(label)+'</td>';hs.forEach(function(r){s+='<td>'+n0(+(r.k&&r.k[key])||0)+'</td>';});s+='<td class="tp">'+n0(kSum(key))+'</td></tr>';return s;}
  var t='<div class="hkwrap"><table class="hktab"><thead><tr><th class="hl"></th>';
  hs.forEach(function(r){t+='<th>No.'+esc(r.no)+'<small>'+esc((r.tarih||'').slice(5).split('-').reverse().join('.'))+'</small></th>';});
  t+='<th class="tp">TOPLAM</th></tr></thead><tbody>';
  t+=rowF('A · Toplam hakediş','A');
  t+=rowF('B · İlave işler','B');
  t+=rowF('C · KDV hariç','C','sep');
  t+=rowF('D · KDV %20','D');
  t+=rowF('D1 · ×%40 devlet','D1');
  t+=rowF('D2 · ×%60 yüklenici','D2');
  t+=rowF('E · Fatura (C+D2)','E','sep');
  t+=rowF('F · Tahakkuk (C+D)','F');
  t+='<tr class="khd"><td class="hl" colspan="'+(cols+2)+'">KESİNTİLER VE MAHSUPLAR</td></tr>';
  kused.forEach(function(x){t+=rowK(x[1],x[0]);});
  t+=rowF('Kesintiler toplamı','G','sep');
  t+=rowF('Net = E − kesinti','net','net');
  t+='</tbody></table></div>';
  h+=t;
  if(ROLE==='admin'){ h+='<div style="margin-top:8px">'; hs.forEach(function(r){ h+='<div class="row"><span>No.'+esc(r.no)+' · '+esc((r.tarih||'').split('-').reverse().join('.'))+'</span><span style="white-space:nowrap"><button class="tag hk_ed" data-no="'+esc(r.no)+'" style="border:0">düzenle</button> <button class="tag hk_sl" data-no="'+esc(r.no)+'" style="border:0;color:var(--red)">sil</button></span></div>'; }); h+='</div>'; }
  return h+'</div>';
}

function gridPers(ym){
  var team=TEAM().filter(function(p){return p.aktif!==false;});
  var dim=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
  if(!team.length)return '<div class="card"><div class="empty">Ekip listesi boş — Daha → Ekip\'ten personel ekleyin</div></div>';
  var pj=PJ(),pjg=PJG();
  /* gün sırası: içinde bulunduğumuz ayda bugünden geriye (bugün solda); geçmiş ayda son günden geriye */
  var isCur=(ym===today().slice(0,7)), son=isCur?+today().slice(8,10):dim, days=[];
  for(var d=son;d>=1;d--)days.push(d);
  /* ay içi giriş + ay toplam gün + en son çalışma günü */
  function ayGiris(p){var n=0;for(var dd=1;dd<=dim;dd++){if(cell(pj,ym,p.id,dd))n++;}return n;}
  function ayTot(p){var t=0;for(var dd=1;dd<=dim;dd++){var m=pjMeta(cell(pj,ym,p.id,dd));t+=m.v*payMult(p.id,ym+'-'+String(dd).padStart(2,'0'));}return t;}
  function sonCalisma(pid){var best='';for(var y in pj){var mp=pj[y]&&pj[y][pid];if(!mp)continue;for(var dd in mp){if(mp[dd]){var iso=y+'-'+(String(dd).length<2?'0'+dd:dd);if(iso>best)best=iso;}}}return best;}
  var esik=dadd(today(),-30);  /* son 30 günde çalışan = aktif */
  /* aktif: bu ay giriş var VEYA son 30 günde çalışmış; uzun süre çalışmayan: gerisi */
  var aktif=[],pasif=[];
  team.forEach(function(p){ var son=sonCalisma(p.id); if(ayGiris(p)>0||(son&&son>=esik))aktif.push(p); else pasif.push(p); });
  aktif.sort(function(a,b){return (sonCalisma(b.id)||'').localeCompare(sonCalisma(a.id)||'')||ayTot(b)-ayTot(a)||(a.ad||'').localeCompare(b.ad||'','tr');});
  pasif.sort(function(a,b){return (sonCalisma(b.id)||'').localeCompare(sonCalisma(a.id)||'')||(a.ad||'').localeCompare(b.ad||'','tr');});
  var rows=aktif.length?aktif.concat(PSHOW?pasif:[]):team.slice().sort(function(a,b){return (sonCalisma(b.id)||'').localeCompare(sonCalisma(a.id)||'');}); /* yakın çalışan yoksa boş kalmasın, herkesi göster */
  function rowHtml(p){var h='<tr><td class="pname">'+esc(p.ad)+'</td>';
    days.forEach(function(d){var c=cell(pj,ym,p.id,d),m=pjMeta(c),gv=cell(pjg,ym,p.id,d),gc=gv&&pjgOf(gv)?pjgOf(gv).c:'';
      h+='<td class="pc" data-p="'+esc(p.id)+'" data-d="'+d+'" style="background:'+(m.bg||'')+';color:'+m.fg+'">'+m.l+(gc?('<i class="pg" style="background:'+gc+'"></i>'):'')+'</td>';});
    return h+'<td class="ptot">'+(ayTot(p)||'')+'</td></tr>';
  }
  var h='<div class="card" style="padding:10px"><div class="pwrap"><table class="ptbl"><thead><tr><th class="pname">Personel</th>';
  days.forEach(function(d){var dow=new Date(+ym.slice(0,4),+ym.slice(5,7)-1,d).getDay();h+='<th class="'+(d===son&&isCur?'tdy':(dow===0?'sun':''))+'">'+d+'</th>';});
  h+='<th class="ptot">Gün</th></tr></thead><tbody>';
  var allT=TEAM();
  h+='<tr><td class="pname" style="color:#6B7177;font-weight:600;font-size:12px">👷 Çalışan</td>';
  days.forEach(function(d){var n=0;allT.forEach(function(p){if(pjMeta(cell(pj,ym,p.id,d)).v>0)n++;});h+='<td style="text-align:center;font-weight:700;background:#EEF4EC;border-bottom:2px solid #d7dcd4;color:'+(d===son&&isCur?'#E8622A':(n?'#2E7D46':'#c2c8bf'))+'">'+(n||'·')+'</td>';});
  h+='<td class="ptot" style="background:#EEF4EC;border-bottom:2px solid #d7dcd4"></td></tr>';
  rows.forEach(function(p){h+=rowHtml(p);});
  h+='</tbody></table></div>';
  if(pasif.length)h+='<button class="more" id="ps_tog" style="margin-top:8px">'+(PSHOW?'▴ Uzun süre çalışmayanları gizle':'▾ Uzun süre çalışmayanları göster ('+pasif.length+')')+'</button>';
  h+='</div>';
  var totYev=0;aktif.forEach(function(p){totYev+=persMaas(p.id).yev;});
  h+='<div class="two"><div class="stat"><div class="k">Çalışan</div><div class="v">'+aktif.length+'</div><div class="s">son 30 gün · '+team.length+' kişiden</div></div>'
    +'<div class="stat mo"><div class="k">Yevmiye (toplam)</div><div class="v" style="font-size:20px">'+usd$(toAZN(totYev,wageCur(aktif[0]&&aktif[0].id)))+'</div><div class="s">işe başlangıçtan</div></div></div>';
  return h;
}

  if(!confirm(ks.length+' kayıt geri yüklenecek, mevcut veriyle birleştirilecek. Devam?'))return;

}

function _stripFoto(r){ if(r&&typeof r==='object'&&!Array.isArray(r)){var x={};for(var k in r)x[k]=r[k];if('foto'in x)x.foto='';if('img'in x)x.img='';return x;} return r; }
function importEski(text){
  var J; try{J=JSON.parse(text);}catch(e){toast('Dosya okunamadı');return;}
  var data=(J&&J.data)||J; if(!data||typeof data!=='object'){toast('Geçersiz yedek');return;}
  var n=0; function put(k,v){ D[k]=v; try{localStorage.setItem(lkey(k),JSON.stringify(v));}catch(e){} try{N8N.mark(k);}catch(e){} n++; }
  ['team','wage','wagehist','mesai','fx','mpct','isbasi','arac','matcustom','parac'].forEach(function(k){ if(data[k]!=null) put(k,data[k]); });
  if(Array.isArray(data.matin)) put('matin', data.matin.map(_stripFoto));
  ['pj','pjg','pjz','pj2x','pja','pjag','pjp','pjpg'].forEach(function(p){ var o={}; for(var k in data){ if(k.indexOf(p+':')===0) o[k.slice(p.length+1)]=data[k]; } if(Object.keys(o).length) put(p,o); });
  var pp=[]; for(var k1 in data){ if(k1.indexOf('ppay:')===0&&data[k1]) pp.push(_stripFoto(data[k1])); } if(pp.length) put('ppay',pp);
  for(var k in data){
    if(k.indexOf('gd:')===0){ put(k,_stripFoto(data[k])); }
    else if(k.indexOf('arpay:')===0){ var r=_stripFoto(data[k]); if(r&&!r.taseron)r.taseron='Adem Arıcan'; put(k,r); }
    else if(k.indexOf('hktah:')===0 && data[k] && typeof data[k]==='object' && data[k].tutar!=null){ put(k,data[k]); }
    else if(k.indexOf('g:')===0 && data[k] && data[k].tarih){ put(k,data[k]); }
  }
  closeSheet(); toast(n+' kayıt aktarıldı ✓');
  try{ if(N8N&&N8N.snapshot) setTimeout(N8N.snapshot,1500); }catch(e){}
  render();
}

/* ---- BELGE (foto/pdf) YEDEĞİNİ İÇE AKTAR ---- */
function importBelge(text,stId){
  var J; try{J=JSON.parse(text);}catch(e){toast('Dosya okunamadı');return;}
  var data=(J&&J.data)||J; if(!data||typeof data!=='object'){toast('Geçersiz yedek');return;}
  var ents=[]; for(var k in data){ if(k.indexOf('foto@')===0 && data[k]){ var sk=k.slice(5); var ci=sk.indexOf(':'); if(ci<0)continue; ents.push({fid:k,tip:sk.slice(0,ci),skey:sk,suf:sk.slice(ci+1),veri:data[k]}); } }
  if(!ents.length){ toast('Bu dosyada belge (foto/pdf) bulunamadı'); return; }
  var pp=PPAY(), ppDirty=false, linked=0, saved=0, i=0;
  function st(m){ try{var e=$(stId); if(e)e.textContent=m;}catch(x){} }
  function step(){
    if(i>=ents.length){ if(ppDirty)set('ppay',pp); try{PH.saveBox();}catch(x){} setTimeout(PH.flush,300);
      st(''); closeSheet(); toast(saved+' belge aktarıldı · '+linked+' kayda bağlandı ✓'); render(); return; }
    var e=ents[i++];
    PH.put(e.fid, e.veri, function(){ saved++;
      if(e.tip==='gd'||e.tip==='arpay'){ var kk=e.skey; var rec=get(kk); if(rec&&typeof rec==='object'){ rec.fotoId=e.fid; set(kk,rec); linked++; } }
      else if(e.tip==='ppay'){ var base=e.suf.replace(/_\d+$/,''); for(var j=0;j<pp.length;j++){ if(pp[j]&&pp[j].id===base&&!pp[j].fotoId){ pp[j].fotoId=e.fid; ppDirty=true; linked++; break; } } }
      if((i%20)===0) st('Aktarılıyor… '+i+' / '+ents.length);
      setTimeout(step, 0);
    });
  }
  st('Aktarılıyor… 0 / '+ents.length); step();
}

/* ---- service worker: yeni sürümü yükle, eski önbelleği devral ---- */
var _swReloaded=false;
function regSW(){
  if(!('serviceWorker' in navigator))return;
  try{
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(_swReloaded)return; _swReloaded=true; location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function(reg){
      try{reg.update();}catch(e){}
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing; if(!nw)return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller && !_swReloaded){
            _swReloaded=true; location.reload();
          }
        });
      });
    }).catch(function(){});
  }catch(e){}
}
/* tek dokunuşla zorla güncelle: SW kaldır + tüm önbellek sil + taze yükle */
function forceUpdate(){
  if(!confirm('Uygulama güncellensin mi?\nÖnbellek temizlenip en son sürüm yüklenir.'))return;
  var done=function(){ try{location.reload(true);}catch(e){location.reload();} };
  Promise.resolve()
    .then(function(){ return ('serviceWorker' in navigator)?navigator.serviceWorker.getRegistrations():[]; })
    .then(function(regs){ return Promise.all((regs||[]).map(function(r){return r.unregister();})); })
    .then(function(){ return ('caches' in window)?caches.keys():[]; })
    .then(function(keys){ return Promise.all((keys||[]).map(function(k){return caches.delete(k);})); })
    .then(done).catch(done);
}

startApp();
regSW();

window.SH={go:go,render:render,openIsArtis:isArtisSheet,importEski:importEski,importSheet:importSheet,importBelge:importBelge};
})();
