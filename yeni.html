/* ---- giriş ---- */

#login .lg{width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,#E8833A,#E50E2A);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;margin-bottom:16px}
#login h1{font:800 26px/1 'Barlow Semi Condensed';letter-spacing:.4px}
#login p{color:var(--mut);font-size:13px;margin:6px 0 22px}
#login .roles{display:flex;gap:8px;width:100%;max-width:360px;margin-bottom:14px}
#login .roles button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 8px;font:700 14px 'Barlow';color:var(--ink)}
#login .roles button.on{border-color:var(--org);background:#FFF2EA;color:var(--org)}
#login .pin{width:100%;max-width:360px}
#login .pin input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:14px;text-align:center;letter-spacing:4px;font-weight:700;margin-bottom:10px}
#login .go{width:100%;max-width:360px;border:0;border-radius:12px;background:var(--org);color:#fff;font:800 16px 'Barlow';padding:15px}
#login .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;font-weight:600}

/* ---- app shell ---- */
#app{display:flex;flex-direction:column;min-height:100vh}
#hd{background:var(--org);color:#fff;padding:16px 16px 14px calc(16px);padding-top:calc(14px + env(safe-area-inset-top,0))}
#hd .r1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
#hd .pj{font:800 20px/1 'Barlow Semi Condensed';letter-spacing:.3px}
#hd .zn{display:inline-flex;align-items:center;gap:6px;margin-top:5px;background:rgba(255,255,255,.2);border-radius:7px;padding:3px 9px;font:700 12px 'Barlow Semi Condensed';border:0;color:#fff}
#hd .hact{display:flex;gap:7px;flex:0 0 auto}
#hd .hb{width:34px;height:34px;border:0;border-radius:9px;background:rgba(255,255,255,.18);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
#hd .rail{margin-top:15px}

#hd .rail .bar i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .4s}
#hd .rail .big{font:800 16px/1 'Barlow Semi Condensed';margin-top:7px}
#hd .rail .big small{font:600 12px 'Barlow';opacity:.9}

#nav button i{font-size:19px;font-style:normal}
#nav button.on{color:var(--org)}

/* ---- kartlar ---- */
.card{background:#fff;border:1.5px solid var(--line);border-radius:5px;padding:14px;margin-bottom:12px}
.ch{font:700 13px/1 'Barlow Semi Condensed';letter-spacing:.3px;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.stat{border:1.5px solid var(--line);border-radius:5px;padding:13px;background:#fff}
.stat .k{font:600 12px 'Barlow';color:var(--mut)}

.row:first-of-type{border-top:0}
.empty{color:#9aa0a6;font-size:13px;text-align:center;padding:16px 0}
.more{width:100%;margin-top:10px;border:0;background:#F4F1EA;color:#43484d;border-radius:6px;padding:11px;font:700 13px 'Barlow'}
.prim{width:100%;border:0;border-radius:7px;background:var(--org);color:#fff;font:800 16px 'Barlow';padding:14px;margin-top:2px}

.ghost{border:1.5px solid var(--line);background:#fff;color:#43484d;border-radius:8px;padding:9px 13px;font:700 13px 'Barlow'}

.gun:first-of-type{border-top:0}
.gd{font:700 12px 'Barlow';color:var(--org);margin-bottom:3px}

.del{position:absolute;right:0;top:11px;border:0;background:none;color:var(--red);font-size:12px;font-weight:600}

/* ilerleme bar */
.pr{margin-bottom:13px}
.prt{display:flex;justify-content:space-between;font:600 13px 'Barlow'}
.prt small{color:#9aa0a6;font-weight:500;font-size:11px}
.trk{height:9px;border-radius:5px;background:#EEEBE3;overflow:hidden;margin:6px 0 4px}

.fm{background:linear-gradient(90deg,#E8622A,#f0a35f)}.fe{background:linear-gradient(90deg,#3f6fb0,#7ba2d8)}

.prp{font:700 13px 'Barlow Semi Condensed'}
.pedit{width:66px;border:1.5px solid var(--line);border-radius:7px;padding:7px;text-align:center;font-weight:700}

/* ============================= YARDIMCI ============================= */
function $(id){return document.getElementById(id);}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function n0(v){return Number(v||0).toLocaleString('tr-TR',{maximumFractionDigits:0});}
function n2(v){return Number(v||0).toLocaleString('tr-TR',{maximumFractionDigits:2});}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function curYM(){return PYM||today().slice(0,7);}
function dadd(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function toast(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(t._t);t._t=setTimeout(function(){t.className='';},2200);}

/* ============================= DEPO (yerel-önce + n8n) ============================= */
function lkey(k){return 'sh2:'+PROJE+':'+k;}
function get(k,def){ if(k in D)return D[k]; try{var r=localStorage.getItem(lkey(k)); if(r!=null){D[k]=JSON.parse(r);return D[k];}}catch(e){} return def===undefined?null:def; }
function set(k,v){ D[k]=v; try{localStorage.setItem(lkey(k),JSON.stringify(v));}catch(e){} N8N.queue(k,v); return true; }
function del(k){ delete D[k]; try{localStorage.removeItem(lkey(k));}catch(e){} N8N.queue(k,null); }
function keys(prefix){ var out=[],seen={}; for(var kk in D){if(kk.indexOf(prefix)===0){out.push(kk);seen[kk]=1;}} try{for(var i=0;i<localStorage.length;i++){var sk=localStorage.key(i),pf='sh2:'+PROJE+':'; if(sk&&sk.indexOf(pf)===0){var kn=sk.slice(pf.length); if(kn.indexOf(prefix)===0&&!seen[kn]){out.push(kn);seen[kn]=1;}}}}catch(e){} return out; }
function getAll(prefix){ var o={}; keys(prefix).forEach(function(k){o[k]=get(k);}); return o; }

/* ---- n8n senkron (arka plan, kayıt ASLA buna bağlı değil) ---- */
var N8N={ q:{}, t:null, dev:(localStorage.getItem('sh2:dev')||('c'+Math.floor(1000+Math.random()*9000))),
  proje:function(){return 'SHAMS1-'+PROJE;},
  skip:function(k){return !k||k==='sess';},
  dot:function(s){var i=$('syncdot'),x=$('synctx');var c={ok:'#49d496',busy:'#FFC400',off:'#8a93a3',err:'#ff6a56'}[s]||'#8a93a3';if(i)i.style.background=c;if(x)x.textContent='n8n '+({ok:'✓',busy:'…',off:'·',err:'!'}[s]||'');},
  queue:function(k,v){ if(N8N.skip(k))return; N8N.q[k]=v; clearTimeout(N8N.t); N8N.t=setTimeout(N8N.flush,1500); },
  flush:function(){ if(!navigator.onLine){N8N.dot('off');return;} var ks=Object.keys(N8N.q); if(!ks.length)return;
    var items=ks.map(function(k){return {anahtar:k,deger:JSON.stringify(N8N.q[k])};}); N8N.dot('busy'); var snap={}; ks.forEach(function(k){snap[k]=1;});
    fetch(N8N_BASE+'/saha-set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proje:N8N.proje(),cihaz:N8N.dev,items:items})})
      .then(function(r){ if(r.ok){ks.forEach(function(k){if(snap[k])delete N8N.q[k];});N8N.dot(Object.keys(N8N.q).length?'busy':'ok');}else N8N.dot('err'); })
      .catch(function(){N8N.dot('off');}); },
  pull:function(cb){ if(!navigator.onLine){cb&&cb();return;} N8N.dot('busy');
    fetch(N8N_BASE+'/saha-get?proje='+encodeURIComponent(N8N.proje())).then(function(r){return r.ok?r.json():null;}).then(function(rows){
      try{ var arr=Array.isArray(rows)?rows:(rows&&rows.data)||[]; arr.forEach(function(row){ var k=row.anahtar,dv=row.deger; if(!k||N8N.skip(k))return; var val; try{val=JSON.parse(dv);}catch(e){val=dv;}
        D[k]=val; try{localStorage.setItem(lkey(k),JSON.stringify(val));}catch(e){} }); }catch(e){}
      N8N.dot('ok'); cb&&cb();
    }).catch(function(){N8N.dot('off');cb&&cb();}); },
  snapshot:function(){ var all=getAll(''); var ks=Object.keys(all).filter(function(k){return !N8N.skip(k);}); if(!ks.length)return;
    for(var i=0;i<ks.length;i+=40){ (function(chunk){ var items=chunk.map(function(k){return {anahtar:k,deger:JSON.stringify(all[k])};});
      fetch(N8N_BASE+'/saha-set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proje:N8N.proje(),cihaz:N8N.dev,items:items})}).catch(function(){}); })(ks.slice(i,i+40)); }
  }
};
try{localStorage.setItem('sh2:dev',N8N.dev);}catch(e){}

/* ============================= HESAPLAR ============================= */
function TEAM(){return get('team',[])||[];}
function teamGet(id){var t=TEAM();for(var i=0;i<t.length;i++)if(t[i].id===id)return t[i];return null;}
function ILP(){return get('ilp',{})||{};}                 // kalem yüzdeleri {id:pct}
function itemPct(it){var p=ILP()[it.id]; return Math.max(0,Math.min(100,+p||0));}
function cumUsd(){var t=0;allItems().forEach(function(it){t+=bedel(it)*itemPct(it)/100;});return t;}
function disUsd(dis){var s=0,w=0;allItems().forEach(function(it){if(it.dis===dis){s+=it.pur*itemPct(it);w+=it.pur;}});return w?s/w:0;}
function gRate(){var fx=get('fx',{})||{};return {usdazn:+fx.usdazn||0,usdtry:+fx.usdtry||0};}
function toAZN(amt,pb){amt=+amt||0;var r=gRate();if(pb==='USD')return amt*r.usdazn;if(pb==='TRY')return r.usdtry?amt*(r.usdazn/r.usdtry):0;return amt;}
function usd$(azn){var r=gRate();return r.usdazn?n0(azn/r.usdazn)+' $':n0(azn)+' ₼';}
function WAGE(){return get('wage',{})||{};}
function wageOf(pid){var w=WAGE();return +((w[pid]!=null&&w[pid]!=='')?w[pid]:(w._def||0))||0;}
function wageCur(pid){var w=WAGE();return (w._c&&w._c[pid])||w._wpb||'AZN';}
function PJ(){return get('pj',{})||{};}
function PJG(){return get('pjg',{})||{};}
function PJ2X(){return get('pj2x',{})||{};}
function MESAI(){return get('mesai',{})||{};}
function TAZM(){return get('tazm',{})||{};}
function PPAY(){return get('ppay',[])||[];}
function cell(obj,ym,pid,d){try{return (obj[ym]&&obj[ym][pid]&&obj[ym][pid][d])||'';}catch(e){return '';}}
function isCift(pid,iso){var ym=iso.slice(0,7),d=+iso.slice(8,10);if(cell(PJ(),ym,pid,d)==='2')return true;return !!cell(PJ2X(),ym,pid,d);}
function isTR(pid){var p=teamGet(pid);return !!(p&&p.uyruk==='Türkiye');}
function payMult(pid,iso){if(isCift(pid,iso))return 2;if(!isTR(pid))return 1;if(iso>='2026-08-01')return 1;return (new Date(iso+'T00:00:00').getDay()===0)?2:1;}
function gPjv(pid,iso){var ym=iso.slice(0,7),d=+iso.slice(8,10);return pjMeta(cell(PJ(),ym,pid,d)).v;}
function gDays(){var out=[],iso=ISB,t=today(),n=0;while(iso<=t&&n<800){out.push(iso);iso=dadd(iso,1);n++;}return out;}
function yevSum(pid){var s=0,days=gDays();days.forEach(function(iso){var v=gPjv(pid,iso);if(v)s+=v*payMult(pid,iso)*wageOf(pid);});return s;}
function mesSum(pid){var s=0,M=MESAI();for(var ym in M){var mp=(M[ym]&&M[ym][pid])||{};for(var d in mp){var saat=+mp[d]||0;if(!saat||d==='_ay')continue;s+=(wageOf(pid)/9)*1.5*saat;}if(mp['_ay'])s+=(wageOf(pid)/9)*1.5*(+mp['_ay']||0);}return s;}
function persMaas(pid){var y=yevSum(pid),m=mesSum(pid),t=+(TAZM()[pid]||0)||0;return {yev:y,mes:m,tazm:t,top:y+m+t};}
function persOdenen(pid){var t=0;PPAY().forEach(function(r){if(r.pid===pid)t+=toAZN(r.tutar,r.pb||'AZN');});return t;}
function persKalan(pid){var M=persMaas(pid),od=persOdenen(pid),cur=wageCur(pid);var hak=toAZN(M.top,cur);return {hak:hak,od:od,kalan:hak-od,M:M,cur:cur};}
function persGun(pid){var t=0;gDays().forEach(function(iso){t+=gPjv(pid,iso);});return t;}
function GUN(){var out=[];keys('g:').forEach(function(k){var v=get(k);if(v)out.push(v);});return out.sort(function(a,b){return (b.tarih||'').localeCompare(a.tarih||'');});}
function phAd(id){for(var i=0;i<PHASES.length;i++)if(PHASES[i][0]===id)return PHASES[i][1];return id||'Genel';}
function engAd(t){for(var i=0;i<ENGEL.length;i++)if(ENGEL[i][0]===t)return ENGEL[i][1];return t||'';}

  var cur=['AZN','USD','TRY'].map(function(c){return '<option>'+c+'</option>';}).join('');
  openSheet('Ödeme ekle','<select id="o_pid">'+opt+'</select><div id="o_info"></div>'
    +'<div class="ch2">Tür / tarih</div><div class="frow"><select id="o_tur">'+tur+'</select><input id="o_tarih" type="date" value="'+today()+'"></div>'
    +'<div class="ch2">Tutar</div><div class="frow"><input id="o_tutar" type="text" inputmode="decimal" placeholder="0"><select id="o_pb" style="max-width:88px">'+cur+'</select></div>'
    +'<input id="o_not" placeholder="Not (opsiyonel)"><button class="prim" id="o_save" style="margin-top:10px">Kaydet</button>');
  function info(){var id=$('o_pid').value,e=$('o_info');if(!id){e.innerHTML='';return;}var k=persKalan(id);$('o_pb').value=k.cur;
    e.innerHTML='<div class="row"><span>Toplam hak</span><b>'+usd$(k.hak)+'</b></div><div class="row"><span>Ödenen</span><b>'+usd$(k.od)+'</b></div><div class="row"><span>Kalan</span><b class="'+(k.kalan>0.5?'':'')+'" style="color:'+(k.kalan>0.5?'#E8622A':'#2E7D46')+'">'+usd$(k.kalan)+'</b></div>';
    if(!$('o_tutar').value&&k.kalan>0.5)$('o_tutar').value=Math.round(k.kalan*100)/100;}
  $('o_pid').onchange=info;if(pid)info();
  $('o_save').onclick=function(){var id=$('o_pid').value;if(!id){toast('Personel seçin');return;}
    var tutar=parseFloat(($('o_tutar').value||'0').replace(',','.'))||0;if(!tutar){toast('Tutar girin');return;}
    var nt=($('o_not').value||'').trim(),tr=$('o_tur').value||'maas';
    var rec={id:'pp'+Date.now(),pid:id,tur:tr,tarih:$('o_tarih').value||today(),tutar:tutar,pb:$('o_pb').value||'AZN',not:(ODTUR[tr]||tr)+(nt?(' · '+nt):''),by:ROLE,ts:Date.now()};
    var p=PPAY();p.unshift(rec);set('ppay',p);closeSheet();toast('Ödeme kaydedildi');render();};
}

/* ---- PUANTAJ ---- */
function vPua(){
  var ym=curYM(),team=TEAM().filter(function(p){return p.aktif!==false;});
  var dim=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
  var A=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var h='<div class="card"><div class="phd"><button class="ghost" id="pm_p">‹</button><b>'+A[+ym.slice(5,7)-1]+' '+ym.slice(0,4)+'</b><button class="ghost" id="pm_n">›</button></div><div class="plg">Dokun: durum · Basılı tut: görev/mesai</div></div>';
  if(!team.length)return h+'<div class="card"><div class="empty">Ekip listesi boş</div></div>';
  h+='<div class="card" style="padding:10px"><div class="pwrap"><table class="ptbl"><thead><tr><th class="pname">Personel</th>';
  for(var d=1;d<=dim;d++){var dow=new Date(+ym.slice(0,4),+ym.slice(5,7)-1,d).getDay();h+='<th class="'+(dow===0?'sun':'')+'">'+d+'</th>';}
  h+='<th class="ptot">Gün</th></tr></thead><tbody>';
  var pj=PJ(),pjg=PJG();
  team.forEach(function(p){ h+='<tr><td class="pname">'+esc(p.ad)+'</td>'; var tot=0;
    for(var d=1;d<=dim;d++){var c=cell(pj,ym,p.id,d),m=pjMeta(c),gv=cell(pjg,ym,p.id,d),gc=gv&&pjgOf(gv)?pjgOf(gv).c:'';
      tot+=m.v*payMult(p.id,ym+'-'+String(d).padStart(2,'0'));
      h+='<td class="pc" data-p="'+esc(p.id)+'" data-d="'+d+'" style="background:'+(m.bg||'')+';color:'+m.fg+'">'+m.l+(gc?('<i class="pg" style="background:'+gc+'"></i>'):'')+'</td>';}
    h+='<td class="ptot">'+(tot||'')+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  var totYev=0;team.forEach(function(p){totYev+=persMaas(p.id).yev;});
  h+='<div class="two"><div class="stat"><div class="k">Çalışan</div><div class="v">'+team.length+'</div><div class="s">aktif</div></div>'
    +'<div class="stat mo"><div class="k">Yevmiye (toplam)</div><div class="v" style="font-size:20px">'+usd$(toAZN(totYev,wageCur(team[0]&&team[0].id)))+'</div><div class="s">işe başlangıçtan</div></div></div>';
  return h;
}
function bPua(){
  PYM=curYM();
  $('pm_p').onclick=function(){PYM=ymShift(curYM(),-1);render();};
  $('pm_n').onclick=function(){PYM=ymShift(curYM(),1);render();};
  document.querySelectorAll('#body .pc').forEach(function(c){var pid=c.getAttribute('data-p'),d=+c.getAttribute('data-d'),tm=null,mv=false;
    c.addEventListener('pointerdown',function(){mv=false;tm=setTimeout(function(){tm=null;mv=true;cellSheet(pid,d);},460);});
    c.addEventListener('pointerup',function(){if(tm){clearTimeout(tm);tm=null;if(!mv)cycle(pid,d);}});
    c.addEventListener('pointercancel',function(){if(tm){clearTimeout(tm);tm=null;}});
  });
}
function ymShift(ym,n){var d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function pjSet(objKey,pid,d,val){var ym=curYM(),o=get(objKey,{})||{};o[ym]=o[ym]||{};o[ym][pid]=o[ym][pid]||{};if(val===''||val==null)delete o[ym][pid][d];else o[ym][pid][d]=val;set(objKey,o);}
function cycle(pid,d){if(!roOk())return;var cur=cell(PJ(),curYM(),pid,d),i=PJORDER.indexOf(cur),nx=PJORDER[(i+1)%PJORDER.length];pjSet('pj',pid,d,nx);render();}
function cellSheet(pid,d){ if(!roOk())return; var ym=curYM(),p=teamGet(pid)||{};
  var cur=cell(PJ(),ym,pid,d);
  var sts=PJST.map(function(s){return '<button class="'+(cur===s.c?'on':'')+'" data-s="'+esc(s.c)+'" style="background:'+(s.bg||'#eee')+';color:'+s.fg+'">'+s.l+'</button>';}).join('');
  var cg=cell(PJG(),ym,pid,d);
  var gov=PJGOREV.map(function(g){return '<button class="'+(cg===g.id?'on':'')+'" data-g="'+g.id+'">'+esc(g.l)+'</button>';}).join('');
  var mes=cell(MESAI(),ym,pid,d)||'';
  openSheet((p.ad||pid)+' · '+d,'<div class="ch2">Durum</div><div class="gos sts">'+sts+'</div><div class="ch2">Görev</div><div class="gos">'+gov+'</div><div class="ch2">Mesai (saat)</div><input id="p_mes" type="number" inputmode="numeric" value="'+esc(mes)+'" placeholder="0"><button class="prim" id="p_ok" style="margin-top:10px">Uygula</button>');
  document.querySelectorAll('#sbox .sts button').forEach(function(b){b.onclick=function(){pjSet('pj',pid,d,b.getAttribute('data-s'));document.querySelectorAll('#sbox .sts button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');};});
  document.querySelectorAll('#sbox .gos:not(.sts) button').forEach(function(b){b.onclick=function(){var g=b.getAttribute('data-g'),cg2=cell(PJG(),ym,pid,d),nv=(cg2===g)?'':g;pjSet('pjg',pid,d,nv);document.querySelectorAll('#sbox .gos:not(.sts) button').forEach(function(x){x.classList.remove('on');});if(nv)b.classList.add('on');};});
  $('p_ok').onclick=function(){var v=+($('p_mes').value||0)||0;pjSet('mesai',pid,d,v||'');closeSheet();render();};
}

/* ---- DAHA ---- */
function vDaha(){
  var h='<div class="card"><div class="ch">Diğer</div>';
  h+='<button class="mod" id="m_team"><span class="mic">👷</span><span class="mtx"><b>Ekip</b><small>Personel ekle / çıkar</small></span></button>';
  h+='<button class="mod" id="m_wage"><span class="mic">₺</span><span class="mtx"><b>Yevmiyeler</b><small>Günlük ücret / para birimi</small></span></button>';
  h+='<button class="mod" id="m_sync"><span class="mic">☁</span><span class="mtx"><b>n8n senkron</b><small>Bağlantı & tam yedek</small></span></button>';
  h+='</div><div class="card"><div class="ch">Saha</div>'
    +'<button class="mod" id="m_tr1"><span class="mic">▣</span><span class="mtx"><b>TR-1 sahası</b><small>'+(PROJE==='tr1'?'aktif':'geç')+'</small></span></button>'
    +'<button class="mod" id="m_tr3"><span class="mic">▣</span><span class="mtx"><b>TR-3 sahası</b><small>'+(PROJE==='tr3'?'aktif':'geç')+'</small></span></button></div>';
  h+='<div class="empty">Malzeme/irsaliye bu sürümde arka planda — istenirse eklenir.</div>';
  return h;
}
function bDaha(){
  $('m_tr1').onclick=function(){switchProje('tr1');};
  $('m_tr3').onclick=function(){switchProje('tr3');};
  $('m_sync').onclick=function(){syncSheet();};
  $('m_team').onclick=function(){teamSheet();};
  $('m_wage').onclick=function(){wageSheet();};
}
function switchProje(p){ if(p===PROJE){go('bugun');return;} PROJE=p; try{localStorage.setItem('sh2:proje',p);}catch(e){} D={}; N8N.pull(function(){ seedIfEmpty(); go('bugun'); toast((p==='tr3'?'TR-3':'TR-1')+' sahasına geçildi'); }); }
function syncSheet(){ openSheet('n8n senkron','<div class="gt" style="margin-bottom:10px">Veri cihazda anında kaydedilir; n8n arka planda ortak kaynağa yazar (rapor/bildirim/yedek).</div><div class="ch2">Webhook</div><input id="n_url" value="'+esc(N8N_BASE)+'"><div class="frow" style="margin-top:10px"><button class="ghost" id="n_save" style="flex:1">Kaydet</button><button class="prim" id="n_snap" style="flex:1">Tümünü gönder</button></div>');
  $('n_save').onclick=function(){N8N_BASE=($('n_url').value||'').trim().replace(/\/$/,'');try{localStorage.setItem('sh2:n8n',N8N_BASE);}catch(e){}closeSheet();toast('Kaydedildi');};
  $('n_snap').onclick=function(){closeSheet();N8N.snapshot();toast('Tam yedek gönderiliyor');};
}
function teamSheet(){ var t=TEAM();
  var h='<button class="prim" id="t_add" style="margin-bottom:12px">+ Personel ekle</button>';
  t.forEach(function(p){h+='<div class="row"><span>'+esc(p.ad)+'<br><small style="color:#9aa0a6">'+esc(p.gorev||'')+'</small></span>'+(ROLE==='admin'?('<button class="ghost t_del" data-id="'+esc(p.id)+'">çıkar</button>'):'')+'</div>';});
  openSheet('Ekip ('+t.length+')',h);
  if($('t_add'))$('t_add').onclick=function(){ if(!roOk())return; var ad=prompt('Personel adı:');if(!ad)return; var tm=TEAM();tm.push({id:'p'+Date.now().toString(36),ad:ad.trim(),gorev:'Mekanik',tel:'',giris:today(),aktif:true});set('team',tm);teamSheet();render();};
  document.querySelectorAll('#sbox .t_del').forEach(function(b){b.onclick=function(){if(!roOk())return;if(!confirm('Çıkarılsın mı?'))return;var id=b.getAttribute('data-id');set('team',TEAM().filter(function(x){return x.id!==id;}));teamSheet();render();};});
}
function wageSheet(){ var t=TEAM(),w=WAGE();
  var h='<div class="ch2">Varsayılan yevmiye</div><div class="frow"><input id="w_def" type="number" inputmode="decimal" value="'+(w._def||'')+'" placeholder="0"><select id="w_cur" style="max-width:88px"><option'+((w._wpb||'AZN')==='AZN'?' selected':'')+'>AZN</option><option'+(w._wpb==='USD'?' selected':'')+'>USD</option><option'+(w._wpb==='TRY'?' selected':'')+'>TRY</option></select></div><button class="ghost" id="w_defsave" style="margin-bottom:14px">Varsayılanı kaydet</button><div class="ch2">Kişiye özel</div>';
  t.forEach(function(p){h+='<div class="frow" style="align-items:center"><span style="flex:1.4;font-size:13px">'+esc(p.ad)+'</span><input class="w_one" data-id="'+esc(p.id)+'" type="number" inputmode="decimal" value="'+(w[p.id]!=null?w[p.id]:'')+'" placeholder="'+(w._def||0)+'" style="flex:1"></div>';});
  openSheet('Yevmiyeler',h);
  $('w_defsave').onclick=function(){if(!roOk())return;var ww=WAGE();ww._def=+$('w_def').value||0;ww._wpb=$('w_cur').value||'AZN';set('wage',ww);toast('Kaydedildi');render();};
  document.querySelectorAll('#sbox .w_one').forEach(function(inp){inp.onchange=function(){if(!roOk())return;var ww=WAGE();var v=inp.value;if(v==='')delete ww[inp.getAttribute('data-id')];else ww[inp.getAttribute('data-id')]=+v||0;set('wage',ww);render();};});
}

/* ---- sheet ---- */
function openSheet(t,html){$('sbox').innerHTML='<div class="sh"><b>'+esc(t)+'</b><button id="shx">×</button></div>'+html;$('sheet').classList.remove('off');$('shx').onclick=closeSheet;}
function closeSheet(){$('sheet').classList.add('off');}

/* ============================= SEED & BAŞLAT ============================= */
function seedIfEmpty(){ // sadece TR-1 ve veri yoksa
  if(PROJE!=='tr1')return;
  if(get('team',null))return; // zaten veri var
  try{ var seed=JSON.parse(document.getElementById('seed').textContent||'{}');
    for(var k in seed){ if(get(k,null)==null) set(k,seed[k]); }
  }catch(e){}
}
function startApp(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden'); $('sync').classList.remove('hidden');
  RO=(ROLE==='demo');
  try{PROJE=localStorage.getItem('sh2:proje')||'tr1';}catch(e){}
  N8N.pull(function(){ seedIfEmpty(); go('bugun'); setTimeout(function(){N8N.snapshot&&N8N.flush();},2000); });
  // ilk render hemen (pull beklemeden)
  seedIfEmpty(); go('bugun');
  // nav
  document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-t'));};});
  $('h_zn').onclick=function(){go('daha');};
  $('h_sync').onclick=function(){N8N.pull(function(){render();toast('Yenilendi');});};
  $('h_out').onclick=function(){if(confirm('Çıkış yapılsın mı?')){try{localStorage.removeItem('sh2:sess');}catch(e){}location.reload();}};
  $('sbg').onclick=closeSheet;
  // "Daha" nav — 6. düğme yok; zn ile açılıyor. Alt menüye Daha ekle:
}
function doLogin(){
  var pin=($('pin').value||'').trim();
  if(ROLE==='admin'&&pin!=='1453'){ $('loginerr').textContent='Şifre hatalı'; return; }
  if(ROLE==='usta'&&pin&&pin!=='0571'){ $('loginerr').textContent='Şifre hatalı'; return; }
  USER=ROLE==='admin'?'Ömer':(ROLE==='usta'?'Usta':'Demo');
  try{localStorage.setItem('sh2:sess',JSON.stringify({role:ROLE,user:USER,ts:Date.now()}));}catch(e){}
  startApp();
}

/* login UI */
document.querySelectorAll('#login .roles button').forEach(function(b){b.onclick=function(){ROLE=b.getAttribute('data-r');document.querySelectorAll('#login .roles button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');$('pinwrap').style.display=(ROLE==='demo')?'none':'block';$('loginerr').textContent='';};});
$('loginbtn').onclick=doLogin;
$('pin').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
// oturum hatırla
try{var s=JSON.parse(localStorage.getItem('sh2:sess')||'null');if(s&&s.role&&(Date.now()-s.ts<7*24*3600*1000)){ROLE=s.role;USER=s.user||'';startApp();}}catch(e){}

window.SH={go:go,render:render};
})();
</script>
