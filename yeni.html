function lkey(k){return 'sh2:'+PROJE+':'+k;}
function get(k,def){ if(k in D)return D[k]; try{var r=localStorage.getItem(lkey(k)); if(r!=null){D[k]=JSON.parse(r);return D[k];}}catch(e){} return def===undefined?null:def; }
function set(k,v){ D[k]=v; try{localStorage.setItem(lkey(k),JSON.stringify(v));}catch(e){} N8N.queue(k,v); return true; }
function del(k){ delete D[k]; try{localStorage.removeItem(lkey(k));}catch(e){} N8N.queue(k,null); }
function keys(prefix){ var out=[],seen={}; for(var kk in D){if(kk.indexOf(prefix)===0){out.push(kk);seen[kk]=1;}} try{for(var i=0;i<localStorage.length;i++){var sk=localStorage.key(i),pf='sh2:'+PROJE+':'; if(sk&&sk.indexOf(pf)===0){var kn=sk.slice(pf.length); if(kn.indexOf(prefix)===0&&!seen[kn]){out.push(kn);seen[kn]=1;}}}}catch(e){} return out; }
function getAll(prefix){ var o={}; keys(prefix).forEach(function(k){o[k]=get(k);}); return o; }

/* ---- n8n senkron (arka plan, kayıt ASLA buna bağlı değil) ---- */
var N8N={ q:{}, t:null, dev:(localStorage.getItem('sh2:dev')||('c'+Math.floor(1000+Math.random()*9000))),
  proje:function(){return 'SHAMS1-'+PROJE;},
  skip:function(k){return !k||k==='sess';},
  dot:function(s){var i=$('syncdot'),x=$('synctx');var c={ok:'#49d496',busy:'#FFC400',off:'#8a93a3',err:'#ff6a56'}[s]||'#8a93a3';if(i)i.style.background=c;if(x)x.textContent='n8n '+({ok:'✓',busy:'…',off:'·',err:'!'}[s]||'');},
  queue:function(k,v){ if(N8N.skip(k))return; N8N.q[k]=v; clearTimeout(N8N.t); N8N.t=setTimeout(N8N.flush,1500); },
  flush:function(){ if(!navigator.onLine){N8N.dot('off');return;} var ks=Object.keys(N8N.q); if(!ks.length)return;
    var items=ks.map(function(k){return {anahtar:k,deger:JSON.stringify(N8N.q[k])};}); N8N.dot('busy'); var snap={}; ks.forEach(function(k){snap[k]=1;});
    fetch(N8N_BASE+'/saha-set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proje:N8N.proje(),cihaz:N8N.dev,items:items})})
      .then(function(r){ if(r.ok){ks.forEach(function(k){if(snap[k])delete N8N.q[k];});N8N.dot(Object.keys(N8N.q).length?'busy':'ok');}else N8N.dot('err'); })
      .catch(function(){N8N.dot('off');}); },
  pull:function(cb){ if(!navigator.onLine){cb&&cb();return;} N8N.dot('busy');
    fetch(N8N_BASE+'/saha-get?proje='+encodeURIComponent(N8N.proje())).then(function(r){return r.ok?r.json():null;}).then(function(rows){
      try{ var arr=Array.isArray(rows)?rows:(rows&&rows.data)||[]; arr.forEach(function(row){ var k=row.anahtar,dv=row.deger; if(!k||N8N.skip(k))return; var val; try{val=JSON.parse(dv);}catch(e){val=dv;}
        D[k]=val; try{localStorage.setItem(lkey(k),JSON.stringify(val));}catch(e){} }); }catch(e){}
      N8N.dot('ok'); cb&&cb();
    }).catch(function(){N8N.dot('off');cb&&cb();}); },
  snapshot:function(){ var all=getAll(''); var ks=Object.keys(all).filter(function(k){return !N8N.skip(k);}); if(!ks.length)return;
    for(var i=0;i<ks.length;i+=40){ (function(chunk){ var items=chunk.map(function(k){return {anahtar:k,deger:JSON.stringify(all[k])};});
      fetch(N8N_BASE+'/saha-set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proje:N8N.proje(),cihaz:N8N.dev,items:items})}).catch(function(){}); })(ks.slice(i,i+40)); }
  }
};

function TEAM(){return get('team',[])||[];}
function teamGet(id){var t=TEAM();for(var i=0;i<t.length;i++)if(t[i].id===id)return t[i];return null;}
function ILP(){return get('ilp',{})||{};}                 // kalem yüzdeleri {id:pct}
function itemPct(it){var p=ILP()[it.id]; return Math.max(0,Math.min(100,+p||0));}
function cumUsd(){var t=0;allItems().forEach(function(it){t+=bedel(it)*itemPct(it)/100;});return t;}
function disUsd(dis){var s=0,w=0;allItems().forEach(function(it){if(it.dis===dis){s+=it.pur*itemPct(it);w+=it.pur;}});return w?s/w:0;}
function gRate(){var fx=get('fx',{})||{};return {usdazn:+fx.usdazn||0,usdtry:+fx.usdtry||0};}
function toAZN(amt,pb){amt=+amt||0;var r=gRate();if(pb==='USD')return amt*r.usdazn;if(pb==='TRY')return r.usdtry?amt*(r.usdazn/r.usdtry):0;return amt;}
function usd$(azn){var r=gRate();return r.usdazn?n0(azn/r.usdazn)+' $':n0(azn)+' ₼';}
function WAGE(){return get('wage',{})||{};}
function wageOf(pid){var w=WAGE();return +((w[pid]!=null&&w[pid]!=='')?w[pid]:(w._def||0))||0;}
function wageCur(pid){var w=WAGE();return (w._c&&w._c[pid])||w._wpb||'AZN';}
function WAGEHIST(){return get('wagehist',{})||{};}
function wageOnDate(pid,iso){var h=WAGEHIST()[pid];if(Array.isArray(h)&&h.length){var best=null;for(var i=0;i<h.length;i++){if(h[i].from<=iso&&(!best||h[i].from>best.from))best=h[i];}if(best)return +best.rate||0;}return wageOf(pid);}
function PJ(){return get('pj',{})||{};}
function PJG(){return get('pjg',{})||{};}
function PJ2X(){return get('pj2x',{})||{};}
function MESAI(){return get('mesai',{})||{};}
function TAZM(){return get('tazm',{})||{};}
function PPAY(){return get('ppay',[])||[];}
function ARAC(){return get('arac',[])||[];}

function PJAG(){return get('pjag',{})||{};}
function GIDER(){var out=[];keys('gd:').forEach(function(k){var v=get(k);if(v)out.push(v);});return out.sort(function(a,b){return (b.ts||0)-(a.ts||0);});}
function ARPAY(){var out=[];keys('arpay:').forEach(function(k){var v=get(k);if(v)out.push(v);});return out.sort(function(a,b){return (b.ts||0)-(a.ts||0);});}
function HKTAH(){var out=[];keys('hktah:').forEach(function(k){var v=get(k);if(v)out.push(v);});return out.sort(function(a,b){return (a.tarih||'').localeCompare(b.tarih||'');});}
function ISARTIS(){var out=[];keys('isartis:').forEach(function(k){var v=get(k);if(v)out.push(v);});return out.sort(function(a,b){return (a.tarih||'').localeCompare(b.tarih||'');});}
function isArtisTop(){var t=0;ISARTIS().forEach(function(r){(r.kalemler||[]).forEach(function(k){t+=+k.tutar||0;});});return t;}
/* foto/belge → base64 (küçültülmüş jpeg, pdf desteği) */
function pickPhoto(inp,cb,pvId){var f=inp.files&&inp.files[0];if(!f){cb('');return;}var pv=pvId?$(pvId):null;
  if(f.type==='application/pdf'){var rd=new FileReader();rd.onload=function(e){cb(e.target.result);if(pv)pv.innerHTML='<span style="display:inline-block;padding:6px 10px;background:#F4F1EA;border-radius:8px;font-size:13px">📄 PDF · '+Math.round(f.size/1024)+' KB</span>';};rd.readAsDataURL(f);return;}
  var rd2=new FileReader();rd2.onload=function(e){var img=new Image();img.onload=function(){var c=document.createElement('canvas');var mx=900,sc=Math.min(1,mx/img.width);c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);var d=c.toDataURL('image/jpeg',0.6);cb(d);if(pv)pv.innerHTML='<img src="'+d+'" style="max-height:120px;border-radius:8px;border:1.5px solid var(--line)">';};img.src=e.target.result;};rd2.readAsDataURL(f);}
function cell(obj,ym,pid,d){try{return (obj[ym]&&obj[ym][pid]&&obj[ym][pid][d])||'';}catch(e){return '';}}
function isCift(pid,iso){var ym=iso.slice(0,7),d=+iso.slice(8,10);if(cell(PJ(),ym,pid,d)==='2')return true;return !!cell(PJ2X(),ym,pid,d);}
function isTR(pid){var p=teamGet(pid);return !!(p&&p.uyruk==='Türkiye');}
function payMult(pid,iso){if(isCift(pid,iso))return 2;if(!isTR(pid))return 1;if(iso>='2026-08-01')return 1;return (new Date(iso+'T00:00:00').getDay()===0)?2:1;}
function gPjv(pid,iso){var ym=iso.slice(0,7),d=+iso.slice(8,10);return pjMeta(cell(PJ(),ym,pid,d)).v;}
function gDays(){var out=[],iso=ISB,t=today(),n=0;while(iso<=t&&n<800){out.push(iso);iso=dadd(iso,1);n++;}return out;}
function yevSum(pid){var s=0,days=gDays();days.forEach(function(iso){var v=gPjv(pid,iso);if(v)s+=v*payMult(pid,iso)*wageOnDate(pid,iso);});return s;}
function mesSum(pid){var s=0,M=MESAI();for(var ym in M){var mp=(M[ym]&&M[ym][pid])||{};for(var d in mp){var saat=+mp[d]||0;if(!saat||d==='_ay')continue;var dd=(''+d).length<2?('0'+d):(''+d);s+=(wageOnDate(pid,ym+'-'+dd)/9)*1.5*saat;}if(mp['_ay'])s+=(wageOnDate(pid,ym+'-15')/9)*1.5*(+mp['_ay']||0);}return s;}
function persMaas(pid){var y=yevSum(pid),m=mesSum(pid),t=+(TAZM()[pid]||0)||0;return {yev:y,mes:m,tazm:t,top:y+m+t};}
function persOdenen(pid){var t=0;PPAY().forEach(function(r){if(r.pid===pid)t+=toAZN(r.tutar,r.pb||'AZN');});return t;}
function persKalan(pid){var M=persMaas(pid),od=persOdenen(pid),cur=wageCur(pid);var hak=toAZN(M.top,cur);return {hak:hak,od:od,kalan:hak-od,M:M,cur:cur};}
function persGun(pid){var t=0;gDays().forEach(function(iso){t+=gPjv(pid,iso);});return t;}
function GUN(){var out=[];keys('g:').forEach(function(k){var v=get(k);if(v)out.push(v);});return out.sort(function(a,b){return (b.tarih||'').localeCompare(a.tarih||'');});}
function phAd(id){for(var i=0;i<PHASES.length;i++)if(PHASES[i][0]===id)return PHASES[i][1];return id||'Genel';}
function engAd(t){for(var i=0;i<ENGEL.length;i++)if(ENGEL[i][0]===t)return ENGEL[i][1];return t||'';}

function vOde(){
  var subs=[['maas','Maaş'],['harcama','Harcamalar'],['hakedis','Hakediş'],['taseron','Taşeron']].filter(function(s){return canSee('od_'+s[0]);});
  if(!subs.length)return '<div class="card"><div class="empty">Bu bölüm için yetkiniz yok</div></div>';
  if(!subs.some(function(s){return s[0]===OSUB;}))OSUB=subs[0][0];
  var h='<div class="card" style="padding:10px"><div class="gos osub">'+subs.map(function(s){return '<button class="'+(OSUB===s[0]?'on':'')+'" data-o="'+s[0]+'">'+esc(s[1])+'</button>';}).join('')+'</div></div>';

function bOde(){

}

    +'<span id="pf_pv">'+(PFOTO?('<img src="'+PFOTO+'" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--line)">'):'<span style="width:84px;height:84px;border-radius:50%;background:#F4F1EA;display:flex;align-items:center;justify-content:center;font-size:34px">📷</span>')+'</span>'
    +'<div style="font:600 12px Barlow;color:var(--org);margin-top:6px">Foto ekle / değiştir</div><input id="pf_foto" type="file" accept="image/*" style="display:none"></label></div>';
  h+='<div class="ch2">Ad Soyad *</div><input id="pf_ad" value="'+esc(p.ad||'')+'" placeholder="Ad Soyad">';
  h+='<div class="frow" style="margin-top:8px"><div style="flex:1"><div class="ch2">Telefon *</div><input id="pf_tel" type="tel" value="'+esc(p.tel||'')+'" placeholder="+994 / +90"></div><div style="flex:1"><div class="ch2">TC Kimlik No *</div><input id="pf_tc" type="tel" inputmode="numeric" value="'+esc(p.kimlikno||'')+'" placeholder="11 hane"></div></div>';
  h+='<div class="frow" style="margin-top:8px"><div style="flex:1"><div class="ch2">Görev</div><select id="pf_gorev">'+rop+'</select></div><div style="flex:1"><div class="ch2">Uyruk</div><select id="pf_uyruk">'+uyr+'</select></div></div>';
  h+='<div class="ch2">Sigorta / SGK (ops.)</div><input id="pf_sig" value="'+esc(p.sigorta||'')+'" placeholder="SGK no / durum">';
  h+='<div class="frow" style="margin-top:8px"><div style="flex:1"><div class="ch2">İşe giriş</div><input id="pf_giris" type="date" value="'+esc(p.giris||today())+'"></div><div style="flex:1"><div class="ch2">Çıkış (ops.)</div><input id="pf_cikis" type="date" value="'+esc(p.cikis||'')+'"></div></div>';
  h+='<div class="ch2" style="color:var(--org)">Yevmiye *</div><div class="frow"><input id="pf_yev" type="number" inputmode="decimal" value="'+esc(yev)+'" placeholder="Günlük ücret"><select id="pf_pb" style="max-width:88px">'+cop+'</select></div>';
  h+='<div class="ch2">Yevmiye geçerlilik başlangıcı</div><input id="pf_wfrom" type="date" value="'+esc((p.giris||today()))+'">';
  if(id){ var hist=(WAGEHIST()[id]||[]).slice().sort(function(a,b){return (a.from||'').localeCompare(b.from||'');});
    h+='<div class="ch2">Yevmiye değişiklikleri</div>';
    if(hist.length)hist.forEach(function(x){h+='<div class="row"><span>'+esc((x.from||'').split('-').reverse().join('.'))+'’den</span><b>'+n0(x.rate)+' '+esc(x.cur||'AZN')+'</b></div>';});
    else h+='<div class="empty" style="padding:6px 0">Değişiklik kaydı yok</div>';
    h+='<div class="frow" style="margin-top:6px"><input id="pf_cfrom" type="date" value="'+today()+'" style="flex:1.2"><input id="pf_crate" type="number" inputmode="decimal" placeholder="Yeni yevmiye" style="flex:1"><button class="ghost" id="pf_cadd">+ Değişiklik</button></div>';
  }
  h+='<button class="prim" id="pf_save" style="margin-top:14px">Kaydet</button>';
  if(id)h+='<button class="ghost" id="pf_del" style="width:100%;margin-top:8px;color:var(--red);border-color:#f0c9c4">Personeli çıkar</button>';
  openSheet(id?'Personel düzenle':'Yeni personel',h);
  $('pf_foto').onchange=function(){pickPhoto($('pf_foto'),function(d){PFOTO=d||'';var pv=$('pf_pv');if(pv&&d)pv.innerHTML='<img src="'+d+'" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--line)">';});};
  if($('pf_cadd'))$('pf_cadd').onclick=function(){var cf=$('pf_cfrom').value,cr=+($('pf_crate').value||0)||0;if(!cr){toast('Yeni yevmiye girin');return;}var wh=WAGEHIST();wh[id]=wh[id]||[];wh[id].push({from:cf||today(),rate:cr,cur:$('pf_pb').value||'AZN'});set('wagehist',wh);var ww=WAGE();ww[id]=cr;set('wage',ww);toast('Değişiklik eklendi');personForm(id);render();};
  $('pf_save').onclick=function(){
    var ad=($('pf_ad').value||'').trim(),tel=($('pf_tel').value||'').trim(),tc=($('pf_tc').value||'').trim(),yv=+($('pf_yev').value||0)||0;
    if(!ad){toast('Ad Soyad zorunlu');return;} if(!tel){toast('Telefon zorunlu');return;} if(!tc){toast('TC Kimlik No zorunlu');return;} if(!yv){toast('Yevmiye zorunlu');return;}
    var pid=id||('p'+Date.now().toString(36));
    var rec={id:pid,ad:ad,tel:tel,kimlikno:tc,sigorta:($('pf_sig').value||'').trim(),uyruk:$('pf_uyruk').value||'',gorev:$('pf_gorev').value||'Mekanik',giris:$('pf_giris').value||today(),cikis:$('pf_cikis').value||'',foto:PFOTO||'',aktif:(p.aktif!==false)};
    var tm=TEAM();var found=false;for(var i=0;i<tm.length;i++){if(tm[i].id===pid){tm[i]=rec;found=true;}}if(!found)tm.push(rec);set('team',tm);
    var ww=WAGE();ww[pid]=yv;ww._c=ww._c||{};ww._c[pid]=$('pf_pb').value||'AZN';set('wage',ww);
    var wfrom=$('pf_wfrom').value||rec.giris;var wh=WAGEHIST();if(!wh[pid]||!wh[pid].length){wh[pid]=[{from:wfrom,rate:yv,cur:$('pf_pb').value||'AZN'}];set('wagehist',wh);}
    closeSheet();toast('Kaydedildi');teamSheet();render();
  };
  if($('pf_del'))$('pf_del').onclick=function(){if(ROLE!=='admin')return;if(!confirm('Personel çıkarılsın mı?'))return;set('team',TEAM().filter(function(x){return x.id!==id;}));closeSheet();toast('Çıkarıldı');teamSheet();render();};
}

/* ---- İŞ ARTIŞI (ek iş / protokol) ---- */
function isArtisSheet(){ var list=ISARTIS();
  var h='<div class="gt" style="margin-bottom:10px">Sözleşme sonrası ek işler. Her artış bir protokolle sabitlenir (tarih + no + kalemler) ve resmi hakedişte görünür.</div>';
  h+='<button class="prim" id="ia_new">+ İş artışı ekle</button>';
  if(list.length){h+='<div class="ch2">Protokoller ('+list.length+')</div>';
    list.forEach(function(r){var tp=0;(r.kalemler||[]).forEach(function(k){tp+=+k.tutar||0;});
      h+='<div class="gun"><div class="gd">Protokol '+esc(r.protokolNo||'—')+' · '+esc((r.tarih||'').split('-').reverse().join('.'))+'</div><div class="gt">'+esc(r.aciklama||'')+' · '+(r.kalemler||[]).length+' kalem · '+n0(tp)+' $</div>'
        +(ROLE==='admin'?('<button class="del ia_del" data-id="'+esc(r.id)+'">sil</button>'):'')+'</div>';
    });
  }
  openSheet('İş Artışı',h);
  $('ia_new').onclick=isArtisForm;
  document.querySelectorAll('#sbox .ia_del').forEach(function(b){b.onclick=function(){if(ROLE!=='admin')return;if(!confirm('Silinsin mi?'))return;del('isartis:'+b.getAttribute('data-id'));isArtisSheet();render();};});
}
function isArtisForm(){ if(!roOk())return;
  var h='<div class="frow"><input id="ia_no" placeholder="Protokol no"><input id="ia_tarih" type="date" value="'+today()+'"></div>'
    +'<input id="ia_acik" placeholder="Açıklama (ör. ilave masa / ek kazı)">'
    +'<div class="ch2">İş kalemleri</div><div id="ia_lines"></div>'
    +'<div class="frow"><input id="ia_kad" placeholder="Kalem adı" style="flex:1.4"><input id="ia_mik" type="number" inputmode="decimal" placeholder="Miktar" style="flex:1"><input id="ia_br" placeholder="Birim" style="flex:.8"></div>'
    +'<div class="frow"><input id="ia_tut" type="number" inputmode="decimal" placeholder="Tutar ($)" style="flex:1"><button class="ghost" id="ia_add">+ Kalem</button></div>'
    +'<button class="prim" id="ia_save" style="margin-top:12px">Protokolü kaydet</button>';
  openSheet('Yeni iş artışı',h);
  var lines=[];
  function redraw(){var c=$('ia_lines');var hh='';if(!lines.length)hh='<div class="empty" style="padding:6px 0">Kalem ekleyin</div>';lines.forEach(function(l,i){hh+='<div class="row"><span>'+esc(l.ad)+' · '+n0(l.miktar)+' '+esc(l.birim||'')+'</span><b>'+n0(l.tutar)+' $ <button class="lx" data-i="'+i+'" style="border:0;background:none;color:var(--red);font-size:16px">×</button></b></div>';});c.innerHTML=hh;c.querySelectorAll('.lx').forEach(function(x){x.onclick=function(){lines.splice(+x.getAttribute('data-i'),1);redraw();};});}
  redraw();
  $('ia_add').onclick=function(){var ad=($('ia_kad').value||'').trim();if(!ad){toast('Kalem adı girin');return;}lines.push({ad:ad,miktar:+($('ia_mik').value||0)||0,birim:($('ia_br').value||'').trim(),tutar:+($('ia_tut').value||0)||0});$('ia_kad').value='';$('ia_mik').value='';$('ia_br').value='';$('ia_tut').value='';redraw();};
  $('ia_save').onclick=function(){var no=($('ia_no').value||'').trim();if(!no){toast('Protokol no girin');return;}if(!lines.length){toast('En az bir kalem ekleyin');return;}
    var rec={id:'ia'+Date.now(),protokolNo:no,tarih:$('ia_tarih').value||today(),aciklama:($('ia_acik').value||'').trim(),kalemler:lines,by:ROLE,ts:Date.now()};
    set('isartis:'+rec.id,rec);closeSheet();toast('İş artışı kaydedildi');render();};
}
/* ---- RAPOR ---- */
function raporSheet(){
  var tot=cumUsd(),pct=SOZBEDEL>0?tot/SOZBEDEL*100:0;
  var team=TEAM().filter(function(p){return p.aktif!==false;});
  var yev=0,od=0;team.forEach(function(p){var k=persKalan(p.id);yev+=k.hak;od+=k.od;});
  var harca=0;GIDER().forEach(function(r){harca+=toAZN(r.tutar,r.pb||'AZN');});
  var tas=0;ARPAY().forEach(function(r){tas+=toAZN(r.tutar,r.pb||'USD');});
  var tah=0;HKTAH().forEach(function(r){tah+=toAZN(r.tutar,r.pb||'USD');});
  var r=gRate();var earnedAZN=tot*(r.usdazn||1);
  function rw(a,b){return '<div class="row"><span>'+a+'</span><b>'+b+'</b></div>';}
  var h='<div style="font:600 13px Barlow;color:#9aa0a6;margin-bottom:10px">SHAMS-1 GES · '+(PROJE==='tr3'?'TR-3':'TR-1')+' · '+today()+'</div>';
  h+='<div class="ch2">İş ilerlemesi</div>'+rw('Toplam ilerleme','%'+pct.toFixed(1).replace('.',','))+rw('Mekanik','%'+disUsd('MEK').toFixed(0))+rw('Elektrik','%'+disUsd('ELK').toFixed(0));
  var iart=isArtisTop();
  h+='<div class="ch2">İşveren (hakediş)</div>'+rw('Sözleşme bedeli',n0(SOZBEDEL)+' $')+(iart?rw('İş artışı',' +'+n0(iart)+' $')+rw('Revize sözleşme',n0(SOZBEDEL+iart)+' $'):'')+rw('Hak edilen',n0(tot+iart)+' $')+rw('Tahsil edilen',usd$(tah))+rw('Kalan alacak',usd$(earnedAZN+iart*(gRate().usdazn||1)-tah));
  h+='<div class="ch2">Personel</div>'+rw('Çalışan',team.length)+rw('Toplam hak',usd$(yev))+rw('Ödenen',usd$(od))+rw('Kalan borç',usd$(yev-od));
  h+='<div class="ch2">Giderler</div>'+rw('Şantiye harcaması',usd$(harca))+rw('Taşerona ödenen',usd$(tas));
  h+='<button class="prim" style="margin-top:14px" onclick="navigator.share?navigator.share({title:\'SHAMS raporu\',text:document.getElementById(\'sbox\').innerText}):SH.render()">Paylaş</button>';
  openSheet('Saha raporu',h);
}
/* ---- sheet ---- */
function openSheet(t,html){$('sbox').innerHTML='<div class="sh"><b>'+esc(t)+'</b><button id="shx">×</button></div>'+html;$('sheet').classList.remove('off');$('shx').onclick=closeSheet;}
function closeSheet(){$('sheet').classList.add('off');}

/* ============================= SEED & BAŞLAT ============================= */
function seedIfEmpty(){ // sadece TR-1 ve veri yoksa
  if(PROJE!=='tr1')return;
  if(get('team',null))return; // zaten veri var
  try{ var seed=JSON.parse(document.getElementById('seed').textContent||'{}');
    for(var k in seed){ if(get(k,null)==null) set(k,seed[k]); }
  }catch(e){}
}
/* rol/kullanıcı portal oturumundan (ae_portal) — burada giriş yok */
function portalOturum(){ try{ var o=JSON.parse(localStorage.getItem('ae_portal')||'null'),S=o&&o.S;
  if(!S||Date.now()>=(o.son||0))return null;
  if(!(S.ka||(S.anahtarlar&&S.anahtarlar.saha)))return null;
  return {S:S, admin:!!S.ka, user:(S.ad||S.isim||S.kad||S.k||(o&&o.kad)||(o&&o.u)||'')}; }catch(e){return null;} }
function startApp(){
  var pt=portalOturum();
  if(!pt){ try{location.replace('/aesun/portal/?git=saha');}catch(e){} return; }
  ROLE=pt.admin?'admin':'saha'; USER=pt.user||(pt.admin?'Yönetici':'Saha'); RO=false;
  $('app').classList.remove('hidden'); $('sync').classList.remove('hidden');
  try{PROJE=localStorage.getItem('sh2:proje')||'tr1';}catch(e){}
  applyNav();
  N8N.pull(function(){ seedIfEmpty(); go('bugun'); setTimeout(function(){N8N.snapshot&&N8N.flush();},2000); });
  seedIfEmpty(); go('bugun');
  document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-t'));};});
  $('h_zn').onclick=function(){zonePicker();};
  $('h_sync').onclick=function(){N8N.pull(function(){render();toast('Yenilendi');});};
  $('h_out').onclick=function(){ try{location.replace('/aesun/portal/');}catch(e){location.reload();} };
  $('sbg').onclick=closeSheet;
}
startApp();

window.SH={go:go,render:render,openIsArtis:isArtisSheet};
})();
