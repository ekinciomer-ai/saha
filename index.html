<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHAMS-1 · Saha İş Yönetimi</title>
<script>
/* Aksaray Enerji Portal girişi zorunlu; oturum varsa yeni uygulamaya yönlendir */
(function(){
  try{
    var o=JSON.parse(localStorage.getItem('ae_portal')||'null'),S=o&&o.S;
    if(!(S&&Date.now()<(o.son||0)&&(S.ka||(S.anahtarlar&&S.anahtarlar.saha)))){
      location.replace('/aesun/portal/?git=saha'); return;
    }
  }catch(e){}
  location.replace('yeni.html'+location.search+location.hash);
})();
</script>
<p style="font:15px system-ui,Arial;color:#2B2F35;padding:24px">Yönlendiriliyor… <a href="yeni.html">Saha İş Yönetimi</a></p>
